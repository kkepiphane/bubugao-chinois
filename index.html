<style>
/* Layout: one-column phone app, sticky top bar in lessons, fixed bottom tab bar elsewhere.
   World: jade thread on cool workshop grey; tones carry their own four colours everywhere. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#E3E9E5; --ink:#17212A; --muted:#56636C; --line:#D2DAD5;
  --accent:#0B7A63; --accent-ink:#FFFFFF; --accent-soft:#D3ECE3;
  --gold:#B97C08; --gold-soft:#F5E5C0;
  --t1:#2563C9; --t2:#13824A; --t3:#9C6208; --t4:#BF2D2B; --t0:#86919A;
  --good:#13824A; --good-soft:#DDF1E5; --bad:#BF2D2B; --bad-soft:#F8DEDC;
  --shadow:0 1px 2px rgba(23,33,42,.06),0 6px 18px rgba(23,33,42,.06);
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Nunito Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-zh:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1518; --surface:#182126; --surface-2:#212C32; --ink:#E7EDEA; --muted:#97A5AD; --line:#2C3940;
  --accent:#38C29D; --accent-ink:#04211A; --accent-soft:#163830;
  --gold:#EDB43C; --gold-soft:#3A2E12;
  --t1:#74A3F4; --t2:#4CC583; --t3:#E2A447; --t4:#F06D69; --t0:#7E8B93;
  --good:#4CC583; --good-soft:#173A28; --bad:#F06D69; --bad-soft:#42201F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1518; --surface:#182126; --surface-2:#212C32; --ink:#E7EDEA; --muted:#97A5AD; --line:#2C3940;
  --accent:#38C29D; --accent-ink:#04211A; --accent-soft:#163830;
  --gold:#EDB43C; --gold-soft:#3A2E12;
  --t1:#74A3F4; --t2:#4CC583; --t3:#E2A447; --t4:#F06D69; --t0:#7E8B93;
  --good:#4CC583; --good-soft:#173A28; --bad:#F06D69; --bad-soft:#42201F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-inline:16px;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800} h2{font-size:21px;font-weight:800} h3{font-size:17px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
.zh{font-family:var(--f-zh);font-weight:500}
.t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t0{color:var(--t0)}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px} .stack.lg{gap:20px} .stack.sm{gap:6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.screen{flex:1;padding-block:20px 110px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1400}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.block{width:100%} .btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon{width:20px;height:20px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14px;border:1.5px solid transparent;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
input[type=text],input[type=number],select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--f-body);padding:0 14px}
input:focus,select:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 9px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:12px;font-weight:800}
.tab .zh{font-size:16px;line-height:1}
.tab.on{color:var(--accent)}

/* home */
.hello{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hello .zh{font-size:15px;color:var(--muted)}
.streak{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.flame{display:inline-flex;align-items:center;gap:4px;font:800 18px var(--f-display);color:var(--gold)}
.jokers{display:flex;gap:3px} .jk{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--gold);border-radius:2px} .jk.on{background:var(--gold)}
.stage-hero{display:flex;flex-direction:column;gap:14px}
.stage-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.stage-pct{font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--accent)}
.stage-pct small{font-size:20px}
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.road-step{display:flex;flex-direction:column;gap:6px}
.road-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.road-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.road-step .nm{font-size:12px;font-weight:800;color:var(--muted)} .road-step.cur .nm{color:var(--ink)}
.road-step .zh{font-size:13px;color:var(--muted)}
.cta{display:flex;flex-direction:column;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;border:0;text-align:left;cursor:pointer;width:100%;box-shadow:var(--shadow)}
.cta h2{color:inherit}
.cta .bits{display:flex;gap:8px;flex-wrap:wrap}
.cta .bit{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800}
.cta.done{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.cta.done .bit{background:var(--surface-2)}
.mission{border:1.5px dashed var(--gold);background:var(--gold-soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font:800 24px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.3}
.phrase{display:flex;gap:12px;align-items:center}
.notice{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px}

/* lesson */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:12px}
.xbtn{width:40px;height:40px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;flex:none}
.prog{flex:1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.lesson{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
.q-title{font:800 20px/1.25 var(--f-display)}
.big-zh{font-family:var(--f-zh);font-weight:700;font-size:52px;line-height:1.15;letter-spacing:.02em;word-break:break-all}
.big-zh.mid{font-size:38px} .big-zh.sm{font-size:30px}
.py{font-size:20px;font-weight:700;letter-spacing:.01em}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;min-height:56px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:16px}
.opt .zh{font-size:24px}
.opt.center{align-items:center;text-align:center}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.5}
.listen{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.playbig{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.playbig .icon{width:40px;height:40px}
.feedback{position:sticky;bottom:0;margin-inline:-16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--line);background:var(--surface)}
.feedback.ok{background:var(--good-soft);border-color:var(--good)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.feedback .verdict{font:800 19px var(--f-display)}
.feedback.ok .verdict{color:var(--good)} .feedback.bad .verdict{color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px;border-radius:14px}
.tiles.answer{border:2px dashed var(--line);background:var(--surface)}
.tile{display:flex;flex-direction:column;align-items:center;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.tile .zh{font-size:22px} .tile .p{font-size:12px;font-weight:700;color:var(--muted)}
.tile.used{visibility:hidden}
.learn-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 16px}
.sec-tag{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.tonekey{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tonekey span{font-size:12.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--surface-2)}
canvas.curve{width:100%;height:180px;display:block;border-radius:12px;background:var(--surface-2)}
.score{font:800 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.recbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--bad);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.recbtn .icon{width:34px;height:34px}
.recbtn.on{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 50%,transparent)}100%{box-shadow:0 0 0 18px transparent}}

.tips{display:flex;flex-direction:column;gap:8px}
.tip{font-size:14.5px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}

/* conversation */
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;display:flex;flex-direction:column;gap:2px}
.bub .zh{font-size:20px} .bub .p{font-size:14px;color:var(--muted);font-weight:600} .bub .fr{font-size:14px;color:var(--muted);font-style:italic}
.bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.bub.me.bad{background:var(--bad-soft)}
.who{font-size:12px;font-weight:800;color:var(--muted)}
.coach{align-self:stretch;background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:14.5px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:800;font-size:13px;cursor:pointer;align-self:flex-start}

/* progress */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar-row b{text-align:right;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.week .dot{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--accent-ink);font-weight:800}
.week .dot.on{background:var(--accent)}
.wordlist{display:flex;flex-direction:column}
.word{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word .zh{font-size:20px;min-width:0}
.mdots{display:flex;gap:3px;flex:none} .mdots i{width:8px;height:8px;border-radius:50%;background:var(--surface-2)} .mdots i.on{background:var(--accent)}
.list-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.list-btn .zh{font-size:22px}
.list-btn.locked{opacity:.55}
.badge{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);flex:none}
.badge.ok{background:var(--good-soft);color:var(--good)}
.ladder{display:flex;flex-direction:column;gap:10px}
.rung{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.rung .num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 16px var(--f-display);background:var(--surface-2);flex:none}
.rung.on .num{background:var(--accent);color:var(--accent-ink)}
.rung.lock{opacity:.6}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
.end-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:24px}
.end-hero .zh{font-size:46px;font-weight:700;color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bonus{border:2px solid var(--gold);border-radius:16px;padding:16px;background:var(--gold-soft);display:flex;flex-direction:column;gap:6px}
.intro-mark{font:800 64px/1 var(--f-zh);color:var(--accent)}
details summary{cursor:pointer;font-weight:800}
a{color:var(--accent)}
</style>

const MARKS={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù',v:'ǖǘǚǜ'};
function mark(syl,t){
  const cap=syl[0]!==syl[0].toLowerCase(); let s=syl.toLowerCase();
  if(t>=1&&t<=4){
    let idx=-1;
    if(s.includes('a')) idx=s.indexOf('a'); else if(s.includes('e')) idx=s.indexOf('e'); else if(s.includes('ou')) idx=s.indexOf('o');
    else for(let i=s.length-1;i>=0;i--){ if('aeiouv'.includes(s[i])){idx=i;break;} }
    if(idx>=0) s=s.slice(0,idx)+MARKS[s[idx]][t-1]+s.slice(idx+1);
  }
  s=s.replace(/v/g,'ü');
  return cap? s[0].toUpperCase()+s.slice(1) : s;
}

  return it;
}

const isIntro=it=>!!(S.items[it.id]&&S.items[it.id].intro);
function nextNew(n){
  const pool=ITEMS.filter(x=>!isIntro(x));
  if(S.focusPack&&!pool.some(x=>x.pk===S.focusPack))S.focusPack=null;
  const byOrd=(a,b)=>(a.st-b.st)||(a.ord-b.ord);
  const focus=pool.filter(x=>x.pk===S.focusPack).sort(byOrd);
  const hsk=pool.filter(x=>x.branch==='hsk'&&x.pk!==S.focusPack).sort(byOrd);
  const br=pool.filter(x=>x.branch===S.branch&&x.pk!==S.focusPack).sort(byOrd);
  const rest=pool.filter(x=>x.branch!=='hsk'&&x.branch!==S.branch&&x.pk!==S.focusPack).sort(byOrd);
  const out=focus.slice(0,n);const nH=Math.ceil((n-out.length)*.6);
  out.push(...hsk.slice(0,nH));out.push(...br.slice(0,n-out.length));
  for(const extra of [hsk,br,rest])for(const x of extra){if(out.length>=n)break;if(!out.includes(x))out.push(x);}
  return out.slice(0,n);
}
function rec(id){return S.items[id]||(S.items[id]={intro:0,sk:{}});}
function skState(id,sk){const r=rec(id);return r.sk[sk]||(r.sk[sk]={S:0,last:0,lap:0});}
function peekS(id,sk){const r=S.items[id];return r&&r.sk[sk]?r.sk[sk].S:0;}
function retention(st,now){if(!st.S)return 0;const dt=Math.max(0,(now-st.last)/DAY);return Math.pow(1+dt/(9*st.S),-1);}
function tonable(it){const nn=it.s.filter(x=>x>0).length;return it.syl.length<=4&&nn>=1&&nn<=3;}
function skillsFor(it){return SK.filter(k=>k!=='ton'||tonable(it));}
function grade(id,sk,note){
  const st=skState(id,sk),now=Date.now(),R=retention(st,now);
  if(note===0){st.S=Math.max(.3,st.S*.4);st.lap++;}
  else{const mult={1:1.3,2:2.2,3:3}[note],floor={1:.5,2:1,3:2}[note];st.S=Math.max(floor,(st.S||0)*(1+(mult-1)*Math.max(.25,1-R)));}
  st.last=now;
}
function priority(it,sk,now,cur){
  const oubli=1-retention(skState(it.id,sk),now);
  const faib=1-S.profile[PMAP[sk]];
  const util=it.branch==='hsk'?1:it.branch!=='travail'?.8:it.st===cur?1:it.st<cur?.6:.3;
  return oubli*.5+faib*.3+util*.2;
}
function mastery(it){if(!isIntro(it))return 0;const ks=skillsFor(it);return ks.reduce((a,k)=>a+Math.min(1,peekS(it.id,k)/14),0)/ks.length;}
function solid(it){return isIntro(it)&&skillsFor(it).every(k=>peekS(it.id,k)>=4);}
function stageProg(i){const its=ITEMS.filter(x=>x.st===i&&x.branch==='travail');return its.reduce((a,x)=>a+mastery(x),0)/its.length;}
function currentStage(){for(let i=0;i<4;i++)if(stageProg(i)<.6)return i;return 3;}
function unlocked(i){return S.demo||i<=currentStage();}
function recentRate(){const h=S.hist.slice(-30);return h.length<8?.8:avg(h);}
function meanR(it,now){return avg(skillsFor(it).map(k=>retention(skState(it.id,k),now)));}
function dueList(now,cur){
  const c=[];ITEMS.filter(isIntro).forEach(it=>skillsFor(it).forEach(sk=>{const R=retention(skState(it.id,sk),now);if(R<.9)c.push({it,sk,p:priority(it,sk,now,cur)});}));
  return c.sort((a,b)=>b.p-a.p);
}

let actx=null;

function yinAt(x,p,W,sr){
  const maxTau=Math.floor(sr/70),minTau=Math.floor(sr/480);
  if(p+W+maxTau>=x.length)return 0;
  const d=new Float32Array(maxTau+1);
  for(let tau=minTau>2?2:1;tau<=maxTau;tau++){let s=0;for(let i=0;i<W;i++){const v=x[p+i]-x[p+i+tau];s+=v*v;}d[tau]=s;}
  const c=new Float32Array(maxTau+1);c[0]=1;let run=0;
  for(let tau=1;tau<=maxTau;tau++){run+=d[tau];c[tau]=run?d[tau]*tau/run:1;}
  let tau=minTau;
  for(;tau<=maxTau;tau++){if(c[tau]<.15){while(tau+1<=maxTau&&c[tau+1]<c[tau])tau++;break;}}
  if(tau>maxTau)return 0;
  const a=c[tau-1],b=c[tau],e=tau+1<=maxTau?c[tau+1]:b,den=a+e-2*b;
  return sr/(tau+(den?(a-e)/(2*den):0));
}
function tpl(t,last){

  if(t===2)return[3,3.4,3.9,4.4,5];
  if(t===3)return last?[2.2,1.4,1,1.8,3.2]:[2.4,1.8,1.3,1.1,1.1];
  if(t===4)return[5,4,3,2,1];
  return[3,2.8,2.6,2.4,2.2];
}
function shapeDist(h,t,w){
  const mh=avg(h),mt=avg(t);const hc=h.map(v=>v-mh),tc=t.map(v=>v-mt);
  const tt=tc.reduce((s,v)=>s+v*v,0);let k=1;
  if(tt>0){k=hc.reduce((s,v,i)=>s+v*tc[i],0)/tt;k=Math.max(.45,Math.min(1.3,k));}
  let s=0;for(let i=0;i<5;i++){const dd=hc[i]-k*tc[i];s+=dd*dd;}
  return Math.sqrt(s/5)+w*Math.abs(mh-(3+(mt-3)*.5));
}
function resample(a,n){const out=[];for(let i=0;i<n;i++){const s=Math.floor(i*a.length/n),e=Math.max(s+1,Math.floor((i+1)*a.length/n));out.push(avg(a.slice(s,e)));}return out;}
function median(a){const b=[...a].sort((x,y)=>x-y);return b.length?b[Math.floor(b.length/2)]:0;}

function analyzeTones(buf,tones){
  const ch=buf.numberOfChannels,len=buf.length,mono=new Float32Array(len);
  for(let c=0;c<ch;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)mono[i]+=d[i]/ch;}
  const f=Math.max(1,Math.round(buf.sampleRate/16000)),sr=buf.sampleRate/f,n=Math.floor(len/f),x=new Float32Array(n);
  for(let i=0;i<n;i++){let s=0;for(let j=0;j<f;j++)s+=mono[i*f+j];x[i]=s/f;}
  const W=Math.round(sr*.03),hop=Math.round(sr*.01);
  const rms=[];let maxR=0;
  for(let p=0;p+W<n;p+=hop){let e=0;for(let i=0;i<W;i++)e+=x[p+i]*x[p+i];const r=Math.sqrt(e/W);rms.push(r);if(r>maxR)maxR=r;}
  const thr=Math.max(.006,maxR*.12);
  let f0=rms.map((r,i)=>r>thr?yinAt(x,i*hop,W,sr):0);
  const voiced=f0.filter(v=>v>0);
  if(voiced.length<8)return{ok:false,msg:'Je n’ai pas bien entendu ta voix. Parle plus fort, près du téléphone, dans un endroit calme.'};
  let med=median(voiced);
  f0=f0.map(v=>!v?0:v>1.8*med?v/2:v<.55*med?v*2:v);
  f0=f0.map((v,i)=>{if(!v)return 0;const w=[f0[i-1],v,f0[i+1]].filter(z=>z>0);return median(w);});
  med=median(f0.filter(v=>v>0));
  // découpage en syllabes
  let runs=[],cur=null,gap=0;
  f0.forEach((v,i)=>{if(v>0){if(cur&&gap<=2){cur.e=i;}else{cur={s:i,e:i};runs.push(cur);}gap=0;}else gap++;});
  runs=runs.filter(r=>r.e-r.s>=3);
  const N=tones.length;
  if(!runs.length)return{ok:false,msg:'Je n’ai pas bien entendu ta voix. Réessaie un peu plus fort.'};
  while(runs.length>N){let bi=0,bg=1e9;for(let i=0;i<runs.length-1;i++){const g=runs[i+1].s-runs[i].e;if(g<bg){bg=g;bi=i;}}runs.splice(bi,2,{s:runs[bi].s,e:runs[bi+1].e});}
  let guard=0;
  while(runs.length<N&&guard++<20){let bi=0;for(let i=1;i<runs.length;i++)if(runs[i].e-runs[i].s>runs[bi].e-runs[bi].s)bi=i;const r=runs[bi];if(r.e-r.s<6)break;const m=Math.floor((r.s+r.e)/2);runs.splice(bi,1,{s:r.s,e:m},{s:m+1,e:r.e});}
  if(runs.length!==N){const s0=runs[0].s,e0=runs[runs.length-1].e,L=(e0-s0+1)/N;runs=[];for(let i=0;i<N;i++)runs.push({s:Math.round(s0+i*L),e:Math.round(s0+(i+1)*L)-1});}
  const segs=runs.map((r,i)=>{
    let lv=[];for(let k=r.s;k<=r.e;k++)if(f0[k]>0)lv.push(Math.max(.5,Math.min(5.5,3+12*Math.log2(f0[k]/med)/2.5)));
    if(lv.length<2)lv=[3,3];
    const core=lv.length>=8?lv.slice(Math.floor(lv.length*.15),Math.ceil(lv.length*.85)):lv;
    const pts=resample(core,5),t=tones[i],last=i===N-1;
    if(!t)return{lv,pts,tone:0,got:0,score:null};
    const w=N>1?.25:0;const ds=[1,2,3,4].map(k=>shapeDist(pts,tpl(k,last),w));
    const dExp=ds[t-1],dOther=Math.min(...ds.filter((_,k)=>k!==t-1));
    const got=ds.indexOf(Math.min(...ds))+1;const r2=dExp/(dExp+dOther+1e-6);
    const score=Math.max(0,Math.min(100,Math.round((.62-r2)/.42*100)));
    return{lv,pts,tone:t,got,score};
  });
  const sc=segs.filter(s=>s.score!=null);
  return{ok:true,segs,score:Math.round(avg(sc.map(s=>s.score)))};
}

function drawCurve(cv,it,res){
  if(!cv)return;const dpr=window.devicePixelRatio||1,W=cv.clientWidth||320,H=cv.clientHeight||180;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
  const L=24,R=8,T=12,B=30,N=it.s.length,sw=(W-L-R)/N,y=l=>T+(5.5-l)/5*(H-T-B);
  g.font='600 11px '+col('--f-body');g.textBaseline='middle';
  for(let l=1;l<=5;l++){g.strokeStyle=col('--line');g.lineWidth=1;g.beginPath();g.moveTo(L,y(l));g.lineTo(W-R,y(l));g.stroke();g.fillStyle=col('--muted');g.fillText(String(l),6,y(l));}
  for(let i=0;i<N;i++){
    const x0=L+i*sw,t=it.s[i],tp=tpl(t,i===N-1);
    g.setLineDash([6,5]);g.lineWidth=3;g.strokeStyle=t?col('--t'+t):col('--t0');g.globalAlpha=.75;g.beginPath();
    tp.forEach((v,k)=>{const xx=x0+sw*(.12+.76*k/4);k?g.lineTo(xx,y(t?v:2.6)):g.moveTo(xx,y(t?v:2.6));});g.stroke();g.globalAlpha=1;g.setLineDash([]);
    if(res&&res.segs&&res.segs[i]){const lv=res.segs[i].lv;g.strokeStyle=col('--ink');g.lineWidth=3.2;g.lineJoin='round';g.lineCap='round';g.beginPath();
      lv.forEach((v,k)=>{const xx=x0+sw*(.12+.76*(lv.length>1?k/(lv.length-1):.5));k?g.lineTo(xx,y(v)):g.moveTo(xx,y(v));});g.stroke();}
    const sc=res&&res.segs&&res.segs[i]?res.segs[i].score:null;
    g.fillStyle=sc==null?col('--muted'):sc>=70?col('--good'):sc>=40?col('--t3'):col('--bad');
    g.font='800 13px '+col('--f-body');g.textAlign='center';g.fillText(mark(it.syl[i],it.t[i]),x0+sw/2,H-13);g.textAlign='left';g.font='600 11px '+col('--f-body');
  }
}

const REC={mr:null,stream:null,timer:null,mode:'mic',step:null};
async function startRec(step){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){REC.mode='file';render();return;}
  try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){REC.mode='file';render();toast('Micro bloqué ici. Utilise l’enregistreur du téléphone.');return;}
  const chunks=[];REC.step=step;
  try{REC.mr=new MediaRecorder(REC.stream);}catch(e){REC.mode='file';render();return;}
  REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  REC.mr.onstop=()=>{try{REC.stream.getTracks().forEach(t=>t.stop());}catch(e){}const blob=new Blob(chunks,{type:REC.mr.mimeType||'audio/webm'});analyzeBlob(step,blob);};
  REC.mr.start();step.rec={state:'rec'};REC.timer=setTimeout(stopRec,6500);render();
}
function stopRec(){clearTimeout(REC.timer);if(REC.mr&&REC.mr.state==='recording')REC.mr.stop();}
async function analyzeBlob(step,blob){
  step.rec={state:'busy'};render();
  try{
    const ab=await blob.arrayBuffer(),ctx=getCtx();
    const buf=await new Promise((res,rej)=>{const p=ctx.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej);});
    const r=analyzeTones(buf,step.it.s);
    if(!r.ok){step.rec={state:'err',msg:r.msg};render();return;}
    step.rec={state:'done',res:r};step.tries=(step.tries||0)+1;
    storeVoice(step.it.id,r);
  }catch(e){step.rec={state:'err',msg:'Je n’ai pas pu lire cet enregistrement. Réessaie.'};}
  render();
}

function toneOptions(it){
  const res=[{t:it.t.slice(),ok:true}],seen=new Set([it.t.join()]);const idx=it.t.map((t,i)=>t?i:-1).filter(i=>i>=0);let g=0;
  while(res.length<4&&g++<60){const t=it.t.slice();const i=rnd(idx);t[i]=rnd([1,2,3,4].filter(v=>v!==it.t[i]));if(Math.random()<.35&&idx.length>1){const j=rnd(idx);t[j]=rnd([1,2,3,4]);}const k=t.join();if(!seen.has(k)){seen.add(k);res.push({t,ok:false});}}
  return shuffle(res);
}

function answer(i){
  const s=ui.sess,st=s.steps[s.i];if(st.res)return;
  let ok=false;
  if(i===-1){ok=false;st.res={ok:false,pick:-1,dunno:true};}
  else if(st.kind==='pair'){ok=i===st.target;st.res={ok,pick:i};}
  else{ok=!!st.q.opts[i].ok;st.res={ok,pick:i};}
  s.n++;if(ok)s.ok++;
  if(s.kind==='test'){save();}
  else if(st.kind==='char'){gradeChar(st.ch.c,ok);S.hist.push(ok?1:0);if(ok)addXP(10);if(!ok&&!st.re){s.steps.push({kind:'char',ch:st.ch,q:charQ(st.ch),sec:'On le revoit',re:true});}save();}
  else if(s.kind==='diag'){
    if(ok)s.diag[st.diag]++;
    if(ok&&st.it){const r=rec(st.it.id);r.intro=r.intro||Date.now();const k=skState(st.it.id,st.kind);k.S=3;k.last=Date.now();}
    save();
  }else{
    if(st.kind==='pair'){S.profile.tons=S.profile.tons*.9+(ok?1:0)*.1;S.hist.push(ok?1:0);if(ok)addXP(10);save();}
    else recordAnswer(st.it,st.kind,ok);
    if(!ok&&!st.re&&s.kind!=='mini'){const c=st.kind==='pair'?{kind:'pair',pr:st.pr,target:st.target,sec:'On le revoit'}:mk(st.kind,st.it,'On le revoit');c.re=true;s.steps.push(c);}
  }
  render();
}
function checkTiles(){
  const s=ui.sess,st=s.steps[s.i];const got=st.q.placed.map(k=>st.q.tiles.find(t=>t.k===k).h).join('');const ok=got===st.it.chunks.map(c=>c.h).join('');
  st.res={ok};s.n++;if(ok)s.ok++;if(s.kind==='test'){render();return;}recordAnswer(st.it,'prod',ok);
  if(!ok&&!st.re){const c=mk('prod',st.it,'On le revoit');c.re=true;s.steps.push(c);}
  render();
}
function next(){
  const s=ui.sess;const st=s.steps[s.i];
  if(st&&st.kind==='learn'){const r=rec(st.it.id);if(!r.intro){r.intro=Date.now();SK.forEach(k=>skState(st.it.id,k));save();}}
  if(st&&st.kind==='shadow'&&s.kind!=='diag'){
    const r=st.rec&&st.rec.state==='done'?st.rec.res:null;
    if(r){const note=r.score>=80?3:r.score>=60?2:r.score>=40?1:0;recordAnswer(st.it,'ton',note>0,note);S.profile.parole=S.profile.parole*.85+(r.score/100)*.15;addXP(10);save();}
  }
  if(st&&st.kind==='shadow'&&s.kind==='diag'){const r=st.rec&&st.rec.state==='done'?st.rec.res:null;s.diag.parole=r?r.score/100:null;}
  if(st&&st.kind==='grammar'){S.grammarSeen[st.pack.id]=1;save();}
  if(st&&st.kind==='charlearn'){const c=charSt(st.ch.c);if(!c.intro){c.intro=Date.now();c.S=.5;c.last=Date.now();}addXP(5);save();}
  if(st&&st.kind==='mission'){S.mission={id:st.it.id,day:today(),status:'open',text:st.text,level:st.level};save();}
  try{speechSynthesis.cancel();}catch(e){}
  REC.mode=REC.mode==='file'?'file':'mic';
  s.i++;
  if(s.i>=s.steps.length)finish();else render();
  window.scrollTo(0,0);
}
function finish(){
  const s=ui.sess;
  if(s.kind==='diag'){
    const d=s.diag,m=v=>.15+.8*v/4;
    S.profile={ecoute:m(d.ecoute),tons:m(d.tons),vocab:m(d.vocab),parole:d.parole==null?.4:Math.max(.15,d.parole)};
    S.onboarded=true;save();s.end=true;render();return;
  }
  if(s.kind==='mini'){const back=s.back;ui.sess=null;ui.tab=back||'home';render();return;}
  if(s.kind==='test'){const acc=s.n?s.ok/s.n:0,hs=hskStats();const est=Math.round(acc*hs.avail);S.tests.push({d:today(),acc:Math.round(acc*100),est,avail:hs.avail});markActive();addXP(40);save();s.end=true;render();return;}
  const msg=markActive();
  S.sessions++;if(s.kind==='daily')S.lastSessionDay=today();
  addXP(s.kind==='daily'?50:s.kind==='chapter'?30:20);
  s.endProg=stageProg(s.cur);s.jokerMsg=msg;
  if(s.kind==='daily'&&(S.sessions===1||Math.random()<.3))s.bonus=rnd(BONUS);
  save();s.end=true;render();
}

function newConv(c){const n=c.nodes[c.start];return{c,node:c.start,log:[{who:'them',h:n.h,p:n.p,fr:n.fr}],fixes:0,mist:[],good:0,dis:[],done:false,showFr:{},showPy:{}};}
function convPick(cs,i){
  const node=cs.c.nodes[cs.node],o=node.o[i];if(cs.dis.includes(i))return;
  cs.log.push({who:'me',h:o.h,p:o.p||'',fr:o.fr||'',bad:!o.ok,frOnly:o.fr_only});
  if(o.ok){
    cs.good++;cs.dis=[];cs.node=o.n;const nn=cs.c.nodes[o.n];
    cs.log.push({who:'them',h:nn.h,p:nn.p,fr:nn.fr});say(nn.h);
    if(nn.end){cs.done=true;S.convDone[cs.c.id]=(S.convDone[cs.c.id]||0)+1;addXP(30);save();}
  }else{
    cs.mist.push({bad:o,best:node.o.find(x=>x.ok)});cs.dis.push(i);
    cs.log.push({who:'them',h:'嗯？',p:'Èng?',fr:'Hein ?'});
    if(cs.fixes<2){cs.log.push({who:'coach',txt:o.fix});cs.fixes++;}
    S.hist.push(0);save();
  }
  render();
  const el=document.querySelector('.chat-end');if(el)el.scrollIntoView({block:'end',behavior:'smooth'});
}

/* ---------- séance ---------- */
function renderSession(){
  const s=ui.sess;
  if(s.end)return app.innerHTML=s.kind==='diag'?diagEnd():s.kind==='test'?testEnd():sessionEnd();
  const st=s.steps[s.i];const total=s.steps.length;
  const body={learn:vLearn,reco:vChoice,oreille:vChoice,ton:vTone,prod:vProd,pair:vPair,shadow:vShadow,conv:vConv,mission:vMission,grammar:vGrammar,charlearn:vCharLearn,char:vChar}[st.kind](st);
  app.innerHTML=`<div class="topbar"><button class="xbtn" data-act="quit" aria-label="Quitter la séance">${ICON.x}</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${s.i}"><i style="width:${s.i/total*100}%"></i></div><span class="small muted" style="font-variant-numeric:tabular-nums">${s.i+1}/${total}</span></div>
   <main class="lesson"><span class="sec-tag">${esc(st.sec)}</span>${body}</main>`;
  if(st.kind==='shadow'){const cv=document.getElementById('cv');if(cv)drawCurve(cv,st.it,st.rec&&st.rec.state==='done'?st.rec.res:null);}
  if(!st.played){st.played=true;
    if(st.kind==='oreille'||st.kind==='ton'||st.kind==='learn')say(st.it.h);
    if(st.kind==='pair')say(st.pr[st.target].h,.75);
    if(st.kind==='conv'&&st.cs.log.length===1)say(st.cs.log[0].h);}
}
function feedback(st,okText){
  if(!st.res)return'';const ok=st.res.ok,it=st.it;
  const praise=rnd(['Bien joué !','Exact !','Bravo !','对了！ Duì le !','Parfait !']);
  return `<div class="feedback ${ok?'ok':'bad'}" role="status"><span class="verdict">${ok?praise:(st.res.dunno?'Pas grave, voici la réponse':'Pas tout à fait')}</span>
   ${it?`<div class="row" style="flex-wrap:nowrap"><div class="grow"><span class="zh" style="font-size:24px">${hzHTML(it)}</span> <b>${pyHTML(it)}</b><br><span>${esc(it.fr)}</span></div><button class="btn sm" data-act="say" data-t="${esc(it.h)}" aria-label="Réécouter">${ICON.play}</button></div>`:(okText||'')}
   ${!ok&&!['diag','mini','test'].includes(ui.sess.kind)&&!st.re?'<span class="small">On le revoit dans un instant.</span>':''}
   <button class="btn ${ok?'primary':''} block" data-act="next">Continuer</button></div>`;
}
const dunno=st=>(ui.sess.kind==='diag'||ui.sess.kind==='test')&&!st.res?`<button class="btn ghost block" data-act="ans" data-i="-1">Je ne sais pas</button>`:'';

function vChoice(st){

function vTone(st){const it=st.it;return `<p class="q-title">Quels tons entends-tu ?</p>

function vProd(st){

function vPair(st){const pr=st.pr;const t=pr[st.target];

  ${dunno(st)}${feedback(st,st.res?`<p>${st.res.ok?'':'C’était '}<span class="zh">${t.h}</span> <b class="t${t.t}">${mark(t.p,t.t)}</b> (${esc(t.fr)}). ${TONETIP[t.t]}</p>`:'')}`;}
function vShadow(st){
  const it=st.it,r=st.rec||{state:'idle'},res=r.state==='done'?r.res:null;

function vConv(st){

    const nodeHide=them&&k===cs.log.length-1&&node.hideFr&&!cs.done;
    return `<div class="bub ${them?'them':'me'} ${m.bad?'bad':''}">${them?`<span class="who">${c.who} · ${esc(c.whoFr)}</span>`:''}
      <span class="${m.frOnly?'':'zh'}">${esc(m.h.replace(/\{name\}/g,S.name||'…'))}</span>${m.p?((them&&S.profile.ecoute>.7&&!cs.showPy[k])?`<button class="linkbtn" data-act="cpy" data-k="${k}">Voir le pinyin</button>`:`<span class="p">${esc(m.p.replace(/\{name\}/g,S.name||'…'))}</span>`):''}
      ${them?(showFr?`<span class="fr">${esc(m.fr)}</span>`:nodeHide?'':`<button class="linkbtn" data-act="cfr" data-k="${k}">Traduire</button>`):''}
      ${them?`<button class="linkbtn" data-act="say" data-t="${esc(m.h)}">${'Réécouter'}</button>`:''}</div>`;}).join('');
  let bottom='';
  if(!cs.done){
    bottom=`${node.coach?`<div class="coach">${esc(node.coach)}</div>`:''}<span class="label">Ta réponse</span><div class="opts">${node.o.map((o,i)=>`<button class="opt ${cs.dis.includes(i)?'dim':''}" data-act="cpick" data-i="${i}" ${cs.dis.includes(i)?'disabled':''}>
       ${o.fr_only?`<span>${esc(o.h)}</span>`:`<span class="zh" style="font-size:20px">${esc(o.h.replace(/\{name\}/g,S.name||'…'))}</span><span class="small">${esc(o.p.replace(/\{name\}/g,S.name||'…'))}</span>${ui.showFr?`<span class="small muted">${esc(o.fr.replace(/\{name\}/g,S.name||'…'))}</span>`:''}`}</button>`).join('')}</div>
      <button class="linkbtn" data-act="togglefr">${ui.showFr?'Masquer l’aide en français':'Aide : voir le français'}</button>`;
  }else{
    const m=cs.mist[0];
    bottom=`<div class="card stack sm"><b>Conversation réussie</b>
      <p class="small"><b>Bien fait :</b> ${cs.good} réponse${cs.good>1?'s':''} juste${cs.good>1?'s':''}${cs.mist.length?'':', sans aucune erreur'}.</p>
      ${m&&!m.bad.fr_only?`<p class="small"><b>À retenir :</b> <span class="zh">${esc(m.best.h.replace(/\{name\}/g,S.name||''))}</span> · ${esc(m.best.p.replace(/\{name\}/g,S.name||''))}</p>`:m?`<p class="small"><b>À retenir :</b> ${esc(m.bad.fix)}</p>`:'<p class="small"><b>Prochain défi :</b> rejoue-la sans regarder le français.</p>'}</div>
      <button class="btn primary block" data-act="next">Continuer</button>`;
  }
  return `<div class="stack sm"><h2>${esc(c.title)}</h2><p class="small muted">${esc(c.intro)}</p></div><div class="chat">${log}</div>${bottom}<span class="chat-end"></span>`;
}
function vGrammar(st){const g=st.pack.grammar;return `<div class="card stack"><span class="label">${esc(st.pack.title)}</span><h2>${esc(g.title)}</h2><p>${esc(g.explain)}</p></div>
  <div class="stack">${(g.examples||[]).map(e=>`<div class="card flat row" style="flex-wrap:nowrap;align-items:flex-start"><button class="btn sm" data-act="say" data-t="${esc(e.h)}" aria-label="Écouter">${ICON.play}</button><div class="grow"><span class="zh" style="font-size:22px">${esc(e.h)}</span><br><span class="small"><b>${esc(e.p)}</b></span><br><span class="small muted">${esc(e.fr)}</span></div></div>`).join('')}</div>
  ${g.tip?`<div class="coach">${esc(g.tip)}</div>`:''}
  <button class="btn primary block" data-act="next">J’ai compris</button>`;}
function vCharLearn(st){const ch=st.ch,w=charWords(ch.c);return `<div class="card learn-card"><span class="label">Nouveau caractère</span>
  <div class="big-zh" style="font-size:96px">${esc(ch.c)}</div><div class="py">${esc(ch.p)}</div><p style="font-size:18px;font-weight:700">${esc(ch.m)}</p>
  <div class="row" style="justify-content:center"><span class="badge" style="font-size:14px">Clé <span class="zh" style="font-size:20px;color:var(--accent)">${esc(ch.r)}</span> = ${esc(ch.rm)}</span></div></div>
  ${w.length?`<div class="card flat stack sm"><span class="label">Tu le connais déjà dans</span>${w.map(it=>`<div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="say" data-t="${esc(it.h)}" aria-label="Écouter">${ICON.play}</button><span class="zh" style="font-size:22px">${it.han.map(c=>c===ch.c?`<b style="color:var(--accent)">${c}</b>`:c).join('')}</span><span class="small grow">${pyHTML(it)} · <span class="muted">${esc(it.fr)}</span></span></div>`).join('')}</div>`:''}
  <p class="small muted">La clé donne un indice sur le sens. Retiens-la : elle revient dans beaucoup d’autres caractères.</p>
  <button class="btn primary block" data-act="next">Je l’ai vu, continuer</button>`;}
function vChar(st){const ch=st.ch;return `<p class="q-title">Quel est ce caractère ?</p>
  <div class="card learn-card"><div class="big-zh" style="font-size:88px">${esc(ch.c)}</div>${st.res?`<span class="badge">Clé ${esc(ch.r)} = ${esc(ch.rm)}</span>`:''}</div>
  <div class="opts">${st.q.opts.map((o,i)=>`<button class="opt ${optCls(st,i,o.ok)}" data-act="ans" data-i="${i}" ${st.res?'disabled':''}>${esc(o.fr)}</button>`).join('')}</div>
  ${st.res?`<div class="feedback ${st.res.ok?'ok':'bad'}" role="status"><span class="verdict">${st.res.ok?'Bien lu !':'Pas tout à fait'}</span><p><span class="zh" style="font-size:26px">${esc(ch.c)}</span> <b>${esc(ch.p)}</b> · ${esc(ch.m)}</p><button class="btn ${st.res.ok?'primary':''} block" data-act="next">Continuer</button></div>`:''}`;}
function vMission(st){const it=st.it;return `<div class="mission"><span class="label" style="color:var(--gold)">Ta mission pour demain · niveau ${st.level}/3 : ${MLEVEL[st.level]}</span><p style="font-size:18px"><b>${esc(st.text)}</b></p>
  <div class="row"><span class="zh" style="font-size:30px">${hzHTML(it)}</span><span class="py" style="font-size:16px">${pyHTML(it)}</span></div><div class="row">${playBtns(it.h,true)}</div>
  <p class="small">Demain, l’app te demandera si tu l’as fait. Chaque mission réussie rapporte 30 XP et compte double dans ta tête : c’est du vrai chinois, avec de vraies personnes.</p></div>
  <button class="btn gold block" data-act="next">J’accepte la mission</button>`;}

function sessionEnd(){
  const s=ui.sess,acc=s.n?Math.round(s.ok/s.n*100):100,cur=s.cur;
  return `<main class="screen" style="padding-bottom:32px"><div class="end-hero"><span class="zh">太棒了！</span><h1>${s.kind==='daily'?'Séance terminée':s.kind==='chapter'?'Chapitre avancé':'Révision terminée'}</h1><p class="muted">Tài bàng le ! Encore une marche de montée.</p></div>
   <div class="kpis"><div class="stat"><b>+${s.xp}</b><span>XP</span></div><div class="stat"><b>${acc}%</b><span>de réussite</span></div><div class="stat"><b>${streakAlive()}</b><span>jour${streakAlive()>1?'s':''} de suite</span></div></div>
   ${s.jokerMsg?`<div class="notice">${esc(s.jokerMsg)}</div>`:''}
   <div class="card stack sm"><span class="label">Étape ${STAGES[cur].fr}</span><div class="row between"><span class="score" style="font-size:30px">${pct(s.startProg)}% → <span style="color:var(--accent)">${pct(s.endProg)}%</span></span></div><div class="bar"><i style="width:${pct(s.endProg)}%"></i></div></div>
   ${s.bonus?`<div class="bonus"><span class="label" style="color:var(--gold)">Surprise : expression bonus</span><div class="row"><span class="zh" style="font-size:30px">${s.bonus.h}</span><button class="btn sm" data-act="say" data-t="${esc(s.bonus.h)}">${ICON.play}</button></div><b>${esc(s.bonus.p)} · ${esc(s.bonus.fr)}</b><p class="small">${esc(s.bonus.note)}</p></div>`:''}
   <p class="small muted" style="text-align:center">${acc>=90?'Trop facile ? Demain, la séance accélère.':acc<70?'C’était dur : demain, on consolide avec moins de nouveautés.':'Rythme idéal : tu apprends dans la bonne zone.'}</p>
   <button class="btn primary block" data-act="home">Retour à l’accueil</button></main>`;
}
function testEnd(){
  const t=S.tests[S.tests.length-1],prev=S.tests[S.tests.length-2],hs=hskStats();
  return `<main class="screen" style="padding-bottom:32px"><div class="end-hero"><span class="zh">考试</span><h1>Test HSK blanc terminé</h1><p class="muted">Kǎoshì · examen</p></div>
   <div class="kpis"><div class="stat"><b>${t.acc}%</b><span>de bonnes réponses</span></div><div class="stat"><b>≈ ${t.est}</b><span>mots HSK 1 maîtrisés (sur ${hs.total})</span></div><div class="stat"><b>${prev?(t.acc-prev.acc>=0?'+':'')+(t.acc-prev.acc):'—'}</b><span>points depuis le dernier test</span></div></div>
   <div class="card flat stack sm"><p>${t.acc>=80?'Excellent. Si ça continue, tu peux t’inscrire au vrai HSK 1.':t.acc>=60?'Bon niveau. Encore quelques chapitres et le HSK 1 sera à ta portée.':'C’est le début : ce test sert de point de comparaison pour le mois prochain.'}</p>
   <p class="small muted">Le test porte sur les ${t.avail} mots HSK 1 déjà dans l’appli. Le prochain sera proposé dans un mois.</p></div>
   <button class="btn primary block" data-act="home">Retour à l’accueil</button></main>`;
}
function diagEnd(){
  const P=S.profile,rows=[['ecoute','Écoute'],['tons','Tons'],['vocab','Vocabulaire'],['parole','Parole']];
  const srt=rows.slice().sort((a,b)=>P[b[0]]-P[a[0]]);
  return `<main class="screen" style="padding-bottom:32px"><div class="stack sm"><span class="label">Résultat du test</span><h1>Voilà ton point de départ${S.name?', '+esc(S.name):''}</h1></div>
   <div class="card stack"><div class="bars">${rows.map(([k,n])=>`<div class="bar-row"><span>${n}</span><div class="bar"><i style="width:${pct(P[k])}%"></i></div><b>${pct(P[k])}</b></div>`).join('')}</div></div>
   <div class="card flat stack sm"><p><b>Ton point fort :</b> ${srt[0][1].toLowerCase()}.</p><p><b>On va surtout travailler :</b> ${srt[3][1].toLowerCase()}. Les séances lui donneront plus de place.</p>
   <p class="small muted">Les mots que tu connais déjà ne te seront pas réappris : ils passent directement en révision.</p></div>
   <button class="btn primary block" data-act="daily">Commencer ma première séance</button>
   <button class="btn ghost block" data-act="home">Voir l’accueil</button></main>`;
}

/* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
let toastT=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800);}
const ACT={
 tab:d=>{ui.tab=d.k;render();window.scrollTo(0,0);},
 say:d=>say(d.t,d.r?parseFloat(d.r):undefined),
 goal:d=>{S.goal=+d.i;save();render();},
 diag:()=>{S.name=(document.getElementById('nm')||{}).value?.trim()||S.name;save();startDiag();},
 skipdiag:()=>{S.name=(document.getElementById('nm')||{}).value?.trim()||S.name;S.onboarded=true;save();render();},
 daily:()=>{if(ui.sess&&ui.sess.end)ui.sess=null;startSession('daily');},
 express:()=>startSession('express'),
 home:()=>{ui.sess=null;ui.tab='home';render();window.scrollTo(0,0);},
 quit:()=>{stopRec();try{speechSynthesis.cancel();}catch(e){}const back=ui.sess.back;const wasDiag=ui.sess.kind==='diag';ui.sess=null;if(wasDiag&&!S.onboarded){S.onboarded=true;save();}ui.tab=back||'home';render();},
 ans:d=>answer(+d.i),
 next:()=>next(),
 tile:d=>{const st=ui.sess.steps[ui.sess.i];if(!st.q.placed.includes(d.k)){st.q.placed.push(d.k);const t=st.q.tiles.find(x=>x.k===d.k);say(t.h);}render();},
 untile:d=>{const st=ui.sess.steps[ui.sess.i];st.q.placed=st.q.placed.filter(k=>k!==d.k);render();},
 checktiles:()=>checkTiles(),
 rec:()=>startRec(ui.sess.steps[ui.sess.i]),
 recstop:()=>stopRec(),
 cpick:d=>convPick(ui.sess.steps[ui.sess.i].cs,+d.i),
 cpy:d=>{ui.sess.steps[ui.sess.i].cs.showPy[+d.k]=true;render();},
 cfr:d=>{ui.sess.steps[ui.sess.i].cs.showFr[+d.k]=true;render();},
 togglefr:()=>{ui.showFr=!ui.showFr;render();},
 conv:d=>{const c=CONVS.find(x=>x.id===d.id);startMini([{kind:'conv',conv:c,sec:'Conversation',cs:newConv(c)}],ui.tab);},
 locked:d=>{const c=CONVS.find(x=>x.id===d.id);toast('Se débloque à l’étape '+STAGES[c.st].fr+'.');},
 lab:d=>startMini([{kind:'shadow',it:BY[d.id],sec:'Labo des tons'}],ui.tab),
 mission:d=>{if(d.v==='yes'){S.missionsDone++;addXP(30);markActive();toast('Bravo ! Tu as parlé chinois pour de vrai. +30 XP');}else toast('Pas de souci. Une nouvelle mission t’attend à la prochaine séance.');S.mission.status=d.v==='yes'?'done':'skip';save();render();},
 demo:()=>{S.demo=!S.demo;save();render();},
 backup:()=>doBackup(),
 restore2:()=>applyRestore(),
 restore0:()=>{ui.pendingRestore=null;render();},
 copybk:()=>{const t=document.getElementById('bk');const done=()=>{S.lastBackup=today();save();toast('Copié. Colle-le dans WhatsApp ou un e-mail.');};try{navigator.clipboard.writeText(ui.backupText).then(done,()=>{t.select();});}catch(e){t.select();}},
 chapter:d=>{S.seenPacks[d.id]=1;S.focusPack=d.id;save();startSession(S.lastSessionDay===today()?'chapter':'daily');},
 seen:d=>{S.seenPacks[d.id]=1;save();render();},
 sync:()=>checkUpdates(true),
 test:()=>startTest(),
 branch:d=>{S.branch=d.k;save();render();},
 gram:d=>{const p=PACKS.find(x=>x.id===d.id);if(p&&p.grammar)startMini([{kind:'grammar',pack:p,sec:'Grammaire'}],ui.tab);},
 install:async()=>{if(!deferredInstall)return;try{deferredInstall.prompt();await deferredInstall.userChoice;}catch(e){}deferredInstall=null;render();},
 redo:()=>startDiag(),
 reset1:()=>{ui.confirmReset=true;render();},
 reset0:()=>{ui.confirmReset=false;render();},
 reset2:()=>{S=fresh();ui.confirmReset=false;ui.tab='home';save();render();},
 pres:()=>{ui.pres=true;render();},
 pres0:()=>{ui.pres=false;render();},
 presy:d=>{ui.presYears=+d.i;render();},
 sayall:()=>{const n=S.name||'';const y={1:'一',2:'两',3:'三',4:'四',5:'五'}[ui.presYears||2];say('您好！我叫'+n+'。我来自多哥。我在鞋厂工作了'+y+'年。我会说法语和中文。我学得很快，工作很认真。我希望在贵公司发展。谢谢！',.8);}
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,b);});
app.addEventListener('toggle',e=>{if(e.target.id==='settings')ui.settingsOpen=e.target.open;},true);
app.addEventListener('change',e=>{
  if(e.target.id==='restorefile'&&e.target.files&&e.target.files[0]){readBackup(e.target.files[0]);e.target.value='';}
  if(e.target.id==='audfile'&&e.target.files&&e.target.files[0])analyzeBlob(ui.sess.steps[ui.sess.i],e.target.files[0]);
  if(e.target.id==='nm2'){S.name=e.target.value.trim();save();}
});
app.addEventListener('input',e=>{
  if(e.target.id==='wf'){ui.wordFilter=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('wf');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}}
  if(e.target.id==='nm'){S.name=e.target.value.trim();}
});
window.addEventListener('resize',()=>{if(ui.sess&&!ui.sess.end){const st=ui.sess.steps[ui.sess.i];if(st&&st.kind==='shadow')drawCurve(document.getElementById('cv'),st.it,st.rec&&st.rec.state==='done'?st.rec.res:null);}});
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(!ui.sess&&ui.tab==='home')render();});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('Bùbùgāo est installée !');});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&window.top===window){navigator.serviceWorker.register('sw.js').catch(()=>{});}
window.addEventListener('online',()=>checkUpdates(false));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.onLine!==false&&Date.now()-(PS._checked||0)>6*3600e3)checkUpdates(false);});
refreshJokers();
render();
if(navigator.onLine!==false)checkUpdates(false);
askPersist().then(()=>{if(!ui.sess&&ui.tab==='progres')render();});
window.addEventListener('appinstalled',()=>askPersist());
</script>
