<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zìzì 字字</title>
<meta name="description" content="Apprendre les caractères chinois : sens, clés, ordre des traits, écriture au doigt, phrases et lectures.">
<meta name="theme-color" content="#2B4C9B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Mise en page : appli d'une colonne pour téléphone, barre d'onglets en bas ; leçons en plein écran.
   Univers : encre bleue sur papier d'écolier, grille d'écriture 米字格 aux traits rouges, quatre couleurs de tons. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E6EAF0; --ink:#161C2A; --muted:#566074; --line:#D3D9E3;
  --accent:#2B4C9B; --accent-ink:#FFFFFF; --accent-soft:#DCE4F6;
  --grid:#E5A39A; --grid-soft:#F3D4CF;
  --gold:#B47A0A; --gold-soft:#F4E4C1;
  --t1:#2563C9; --t2:#13824A; --t3:#9C6208; --t4:#BF2D2B; --t0:#86919A;
  --good:#13824A; --good-soft:#DDF1E5; --bad:#BF2D2B; --bad-soft:#F8DEDC;
  --m0:#E6EAF0; --m1:#C9D5EF; --m2:#8FA6DD; --m3:#2B4C9B;
  --shadow:0 1px 2px rgba(22,28,42,.06),0 6px 18px rgba(22,28,42,.06);
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Nunito Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-zh:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131C; --surface:#171E2B; --surface-2:#212A3A; --ink:#E6EBF4; --muted:#9AA6BA; --line:#2C3649;
  --accent:#8FA9EE; --accent-ink:#0B1530; --accent-soft:#1F2B48;
  --grid:#7A3E38; --grid-soft:#3A2522;
  --gold:#EDB43C; --gold-soft:#3A2E12;
  --t1:#74A3F4; --t2:#4CC583; --t3:#E2A447; --t4:#F06D69; --t0:#7E8B93;
  --good:#4CC583; --good-soft:#173A28; --bad:#F06D69; --bad-soft:#42201F;
  --m0:#212A3A; --m1:#2A3A5E; --m2:#4A63A8; --m3:#8FA9EE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#171E2B; --surface-2:#212A3A; --ink:#E6EBF4; --muted:#9AA6BA; --line:#2C3649;
  --accent:#8FA9EE; --accent-ink:#0B1530; --accent-soft:#1F2B48;
  --grid:#7A3E38; --grid-soft:#3A2522;
  --gold:#EDB43C; --gold-soft:#3A2E12;
  --t1:#74A3F4; --t2:#4CC583; --t3:#E2A447; --t4:#F06D69; --t0:#7E8B93;
  --good:#4CC583; --good-soft:#173A28; --bad:#F06D69; --bad-soft:#42201F;
  --m0:#212A3A; --m1:#2A3A5E; --m2:#4A63A8; --m3:#8FA9EE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-inline:16px;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800} h2{font-size:21px;font-weight:800} h3{font-size:17px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
.zh{font-family:var(--f-zh);font-weight:500}
.t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t0{color:var(--t0)}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px} .stack.sm{gap:6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.screen{flex:1;padding-block:20px 110px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;cursor:pointer;color:var(--ink);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.block{width:100%} .btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,.chip:focus-visible,.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon{width:20px;height:20px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14px;border:1.5px solid transparent;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
input[type=text]{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--f-body);padding:0 14px}
input:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.notice{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:800;font-size:13.5px;cursor:pointer}

/* barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 9px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:12px;font-weight:800}
.tab .zh{font-size:17px;line-height:1}
.tab.on{color:var(--accent)}

/* accueil */
.hello{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.flame{display:inline-flex;align-items:center;gap:4px;font:800 18px var(--f-display);color:var(--gold)}
.cta{display:flex;flex-direction:column;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;border:0;text-align:left;cursor:pointer;width:100%;box-shadow:var(--shadow)}
.cta h2{color:inherit}
.cta .bits{display:flex;gap:8px;flex-wrap:wrap}
.cta .bit{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800}
.cta.done{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.cta.done .bit{background:var(--surface-2)}
.big-num{font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--accent)}
.big-num small{font-size:18px;color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.strip .zh{font-size:26px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--surface-2)}

/* grille d'écriture 米字格 */
.mizige{position:relative;margin:0 auto;border:2px solid var(--grid);border-radius:6px;background:var(--surface)}
.mizige svg.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mizige .hw{position:relative}
.mizige .zh-fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:150px;font-family:var(--f-zh)}

/* fiche */
.fiche{display:flex;flex-direction:column;gap:16px}
.fiche-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.py{font-size:24px;font-weight:800}
.sens{font:800 22px/1.2 var(--f-display)}
.keybox{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.keybox .k{font:700 34px/1 var(--f-zh);color:var(--bad);min-width:40px;text-align:center}
.story{border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:0 12px 12px 0;padding:12px 14px;font-size:16px}
.wordrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.wordrow:last-child{border-bottom:0}
.wordrow .zh{font-size:22px}
.hl{color:var(--accent);font-weight:700}
.sent{font-family:var(--f-zh);font-size:22px;line-height:1.5}
.sent .hl{border-bottom:3px solid var(--accent)}
.playmini{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}

/* séance */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:12px}
.xbtn{width:40px;height:40px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;flex:none}
.prog{flex:1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.lesson{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
.sec-tag{display:inline-flex;align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--accent-soft);font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.q-title{font:800 20px/1.25 var(--f-display)}
.qchar{font:700 110px/1.1 var(--f-zh);text-align:center}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;text-align:center;min-height:56px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:16px}
.opt.left{align-items:flex-start;text-align:left}
.opt .zh{font-size:40px;line-height:1.1}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
.playbig{width:88px;height:88px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);margin:0 auto}
.playbig .icon{width:36px;height:36px}
.feedback{position:sticky;bottom:0;margin-inline:-16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--line);background:var(--surface)}
.feedback.ok{background:var(--good-soft);border-color:var(--good)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.verdict{font:800 19px var(--f-display)}
.feedback.ok .verdict{color:var(--good)} .feedback.bad .verdict{color:var(--bad)}
.write-status{text-align:center;font-weight:700;min-height:24px}

/* mur */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.cell{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;font:600 24px/1 var(--f-zh);display:grid;place-items:center;cursor:pointer;background:var(--m0);color:var(--muted)}
.cell.m1{background:var(--m1);color:var(--ink)} .cell.m2{background:var(--m2);color:#fff} .cell.m3{background:var(--m3);color:var(--accent-ink)}
.cell.next{outline:2px dashed var(--accent);outline-offset:-2px;color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}

/* clés */
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.keycard{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.keycard .k{font:700 30px/1 var(--f-zh);color:var(--bad);min-width:36px;text-align:center}

/* lectures */
.lect{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;width:100%;text-align:left}
.lect.locked{opacity:.6;cursor:default}
.reader-s{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.reader-s .line{font:500 26px/1.6 var(--f-zh);display:flex;flex-wrap:wrap}
.reader-s .ch{cursor:pointer;border-radius:4px;padding:0 1px}
.reader-s .ch.new{border-bottom:2px dashed var(--gold)}
.reader-s .ch:active{background:var(--accent-soft)}

/* feuille (fiche en surimpression) */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.end-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:24px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font:800 24px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.3}
.loading{flex:1;display:grid;place-items:center;font:700 64px var(--f-zh);color:var(--accent)}
/* ---------- Zìzì 2 : niveaux, défis, quêtes, HSK, progrès ---------- */
:root{--seal:#C8332B;--seal-ink:#FFF4EC;--night:#141B2B;--night-2:#222C42;--night-ink:#F3EEDF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--seal:#E0574D;--night:#0A0F18;--night-2:#18202F}}
:root[data-theme="dark"]{--seal:#E0574D;--night:#0A0F18;--night-2:#18202F}
/* sceau 印章 : le titre du niveau, en colonne comme un vrai tampon */
.seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;flex:none;width:46px;height:56px;border-radius:6px;background:var(--seal);color:var(--seal-ink);
  font:700 19px/1.05 var(--f-zh);box-shadow:inset 0 0 0 2.5px var(--seal),inset 0 0 0 4px var(--seal-ink);transform:rotate(-4deg)}
.seal.big{width:92px;height:112px;font-size:38px;border-radius:10px;box-shadow:inset 0 0 0 4px var(--seal),inset 0 0 0 7px var(--seal-ink)}
.seal.off{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 2.5px var(--surface-2),inset 0 0 0 4px var(--line);transform:none}
.rankline{display:flex;align-items:center;gap:12px}
.xpbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--seal))}
/* carte séance : papier d'écolier quadrillé */
.cta{position:relative;overflow:hidden;background:var(--accent) radial-gradient(circle at 100% 0,rgba(255,255,255,.16),transparent 55%)}
.cta::after{content:'';position:absolute;right:-18px;bottom:-18px;width:120px;height:120px;border:2px dashed rgba(255,255,255,.22);border-radius:8px;
  background:linear-gradient(45deg,transparent 49.5%,rgba(255,255,255,.18) 49.5% 50.5%,transparent 50.5%),linear-gradient(-45deg,transparent 49.5%,rgba(255,255,255,.18) 49.5% 50.5%,transparent 50.5%);pointer-events:none}
.cta.done::after{display:none}
.durs{display:flex;gap:6px}
.dur{border:0;border-radius:999px;padding:6px 12px;font:800 13.5px var(--f-body);cursor:pointer;background:rgba(255,255,255,.16);color:inherit}
.dur.on{background:#fff;color:#22408A}
.cta .go{background:#fff;border-color:#fff;color:#22408A}
.cta.done .dur{background:var(--surface-2)} .cta.done .dur.on{background:var(--accent);color:var(--accent-ink)}
/* défi du jour : carte encre de nuit */
.defi{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;background:var(--night);border:1px solid rgba(237,180,60,.28);color:var(--night-ink);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.defi .zhbig{position:absolute;right:10px;top:-8px;font:700 92px/1 var(--f-zh);color:rgba(243,238,223,.07);pointer-events:none}
.defi .label{color:#EDB43C}
.defi .muted{color:rgba(243,238,223,.72)}
.defi .btn{border-color:#EDB43C;background:#EDB43C;color:#1B1405}
.defi .btn.ghost{background:transparent;color:var(--night-ink);border-color:rgba(243,238,223,.25)}
.minis{display:flex;gap:8px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;background:var(--night-2);color:var(--night-ink);border:0;font:700 13px var(--f-body);cursor:pointer}
.mini .zh{font-size:15px;color:#EDB43C}
/* quêtes du jour */
.quest{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .qi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--f-zh);background:var(--surface-2);color:var(--muted);flex:none}
.quest.ok .qi{background:var(--seal);color:var(--seal-ink)}
.quest .bar{height:6px;margin-top:4px}
.quest.ok .bar i{background:var(--good)}
/* combo et points */
.combo{font:800 13px var(--f-body);color:var(--seal);background:var(--bad-soft);padding:3px 9px;border-radius:999px;white-space:nowrap}
.combo .zh{font-weight:700}
/* segment (Caractères / Clés) */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;padding:9px 0;background:transparent;font:800 14px var(--f-body);cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* jeux */
.gtop{display:flex;align-items:center;gap:12px}
.timer{font:800 20px var(--f-display);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.timer.low{color:var(--bad)}
.score{font:800 15px var(--f-body);font-variant-numeric:tabular-nums;color:var(--gold)}
svg.mys{position:relative;display:block;margin:2px}
svg.mys .inkin{animation:inkin .45s ease-out}
.huntgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hunt{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:500 34px/1 var(--f-zh);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.hunt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.hunt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.hunt.miss{border-color:var(--gold);border-style:dashed}
.flash{animation:flash .35s}
/* examen */
.part{font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.exq{font:500 30px/1.5 var(--f-zh);text-align:center}
.exq .py{display:block;font:700 15px var(--f-body);color:var(--muted)}
.gauge{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.result-part{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:14px}
/* progrès */
.ladder{display:flex;flex-direction:column}
.rung{display:flex;align-items:center;gap:12px;padding:8px 0}
.rung .seal{width:38px;height:46px;font-size:16px}
.rung.cur{background:var(--gold-soft);margin-inline:-16px;padding-inline:16px;border-radius:12px}
.cal{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.cal i{aspect-ratio:1;border-radius:3px;background:var(--surface-2);position:relative}
.cal i.l1{background:var(--m1)} .cal i.l2{background:var(--m2)} .cal i.l3{background:var(--m3)}
.cal i.stamp::after{content:'';position:absolute;inset:28%;border-radius:50%;background:var(--seal)}
.cal i.fut{background:transparent}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11.5px;line-height:1.25;color:var(--muted)}
.badge .bz{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 22px var(--f-zh);background:var(--surface-2);color:var(--line);border:2px dashed var(--line)}
.badge.on{color:var(--ink)} .badge.on .bz{background:var(--gold-soft);color:var(--gold);border:2px solid var(--gold)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.bars i.pass{background:var(--good)}
/* fin de séance et nouveau titre */
.stampin{animation:stampin .55s cubic-bezier(.2,1.6,.4,1) both}
.pop{animation:pop .4s ease-out both}
.newtitle{display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;background:var(--gold-soft);border:2px solid var(--gold)}
.welcome{display:flex;flex-direction:column;gap:10px;border-radius:16px;padding:16px;background:var(--accent-soft);border:1px solid var(--accent)}
.welcome ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
@keyframes inkin{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
@keyframes stampin{0%{transform:scale(2.4) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes flash{0%{background:var(--bad-soft)}100%{background:transparent}}
/* rouleau 卷 : la progression sur l'accueil, écrite en colonnes de droite à gauche */
.scroll{display:flex;justify-content:center;margin:6px auto 2px}
.roller{width:13px;border-radius:7px;background:linear-gradient(90deg,#4A2F1B,#A0703F 45%,#4A2F1B);position:relative;margin:-10px 0;flex:none}
.roller::before,.roller::after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#3A2414}
.roller::before{top:-5px}.roller::after{bottom:-5px}
.paper{position:relative;background:#FBF6EC;padding:10px 8px;box-shadow:inset 0 6px 8px -6px rgba(0,0,0,.18),inset 0 -6px 8px -6px rgba(0,0,0,.18)}
.cols{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,48px);grid-auto-columns:50px;direction:rtl;border-right:1px solid rgba(200,51,43,.45)}
.sc{direction:ltr;position:relative;border:0;border-left:1px solid rgba(200,51,43,.45);background:none;padding:0;font:500 31px/1 var(--f-zh);color:#1F2A44;display:grid;place-items:center;cursor:pointer}
.sc.ghost{color:rgba(31,42,68,.11)}
.sc.fade{color:rgba(31,42,68,.34)}
.sc.next{color:rgba(200,51,43,.22)}
.sc.next::before{content:'';position:absolute;inset:6px 7px;border:2px dashed #C8332B;border-radius:6px;animation:pulse 1.6s ease-in-out infinite}
.sc.inkin{animation:inkin .7s ease-out both}
.sc .sl{position:absolute;right:3px;top:3px;font:700 9px/1 var(--f-zh);font-style:normal;background:#C8332B;color:#FFF4EC;padding:2px 2px 1px;border-radius:2px}
.sc:empty{cursor:default}
.paper .seal{position:absolute;left:-4px;bottom:6px}
.pdots{display:flex;justify-content:center;align-items:center;gap:0}
.pd{width:19px;height:26px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.pd::after{content:'';width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);box-sizing:border-box}
.pd.done::after{background:var(--seal);border-color:var(--seal)}
.pd.cur::after{border-color:var(--accent);background:var(--accent-soft)}
.pd.view::after{width:13px;height:13px;outline:2px solid var(--accent-soft)}
.pnav{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:800 18px var(--f-body);color:var(--ink)}
.pnav[disabled]{opacity:.35;cursor:default}
.pagedone{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:#FBF6EC;color:#1F2A44;border:2px solid #C8332B}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}.stampin,.pop,svg.mys .inkin,.hunt.bad,.flash,.sc.inkin,.sc.next::before{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="loading" aria-label="Chargement">字</div></div>
<div id="sheet" class="sheet-bg" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="hanzi-writer.min.js"></script>
<script>
/* ============================================================
   OUTILS
   ============================================================ */
const app=document.getElementById('app'),sheetEl=document.getElementById('sheet');
const DAY=86400000,pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/DAY);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>Math.round(Math.max(0,Math.min(1,x))*100);
const avg=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
const HAN=/[㐀-鿿]/;
const ICON={
 play:'<svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>',
 x:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 flame:'<svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5 5 5.6 5 10.5A5 5 0 0 1 7 13c0-2 1-3.4 2-4.3.2 1.6 1 2.6 2 3C11 8.5 10.5 5 12 2z"/></svg>',
 brush:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6-8.5 8.5a3 3 0 0 1-2 .9L5 20l.6-4.5a3 3 0 0 1 .9-2z"/><path d="M12.5 5.5l6 6"/></svg>',
 lock:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
 check:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 gear:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};
let toastT=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800);}

/* pinyin : couleur par ton, syllabe par syllabe */
const TONES=['āēīōūǖ','áéíóúǘ','ǎěǐǒǔǚ','àèìòùǜ'];
function toneOf(s){for(const ch of s)for(let t=0;t<4;t++)if(TONES[t].includes(ch))return t+1;return 0;}
function splitSyl(word){return word.match(/[^aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ’]*[aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+(?:ng|n(?![aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ])|r(?![aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]))?/gi)||[word];}
function pyHTML(p){return esc(p).split(/(\s+)/).map(w=>/\s/.test(w)||!w?w:splitSyl(w).map(s=>`<span class="t${toneOf(s)}">${s}</span>`).join('')).join('');}

/* ============================================================
   DONNÉES ET ÉTAT
   ============================================================ */
let DATA=null,TRAITS=null;const BYC={};
const KEY='zizi.v1';
function fresh(){return{v:1,name:'',perDay:5,dur:10,chars:{},hist:[],xp:0,streak:0,best:0,lastDay:null,jokers:2,jokerMonth:today().slice(0,7),days:{},lastSessionDay:null,sessions:0,read:{},lastBackup:null,milestones:{},
  games:{},q:null,qDays:0,stamps:{},exams:[],stats:{},mins:0,badges:{}};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)return Object.assign(fresh(),o);}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load()||fresh();
const ui={tab:'home',sess:null,game:null,exam:null,wallQ:'',murMode:'chars',openKey:null,reader:null,showPy:{},showFr:{},levelUp:null};

/* ---------- révisions espacées : 3 compétences par caractère ---------- */
const SK=['sens','son','ecrit'];
const isIntro=c=>!!(S.chars[c]&&S.chars[c].intro);
function rec(c){return S.chars[c]||(S.chars[c]={intro:0,sk:{}});}
function skState(c,k){const r=rec(c);return r.sk[k]||(r.sk[k]={S:0,last:0,lap:0});}
function peek(c,k){const r=S.chars[c];return r&&r.sk[k]?r.sk[k].S:0;}
function retention(st,now){if(!st.S)return 0;const dt=Math.max(0,(now-st.last)/DAY);return Math.pow(1+dt/(9*st.S),-1);}
function grade(c,k,ok){
  const st=skState(c,k),now=Date.now(),R=retention(st,now);
  if(!ok){st.S=Math.max(.3,st.S*.4);st.lap++;}
  // réussi au bon moment (R≈0,9) : intervalle ×2,5 ; revu trop tôt : ×1,2 ; revu tard : jusqu'à ×4
  else st.S=Math.max(1,(st.S||0)*Math.min(4,1.2+13*Math.max(0,1-R)));
  st.last=now;
}
function mastery(c){if(!isIntro(c))return 0;return avg(SK.map(k=>Math.min(1,peek(c,k)/14)));}
function level(c){if(!isIntro(c))return 0;const m=mastery(c);return m>=.5?3:m>=.15?2:1;}
const knownCount=()=>DATA.chars.filter(x=>isIntro(x.c)).length;
function dueList(now){const out=[];DATA.chars.forEach(x=>{if(!isIntro(x.c))return;SK.forEach(k=>{const R=retention(skState(x.c,k),now);if(R<.9)out.push({c:x.c,k,R});});});return out.sort((a,b)=>a.R-b.R);}
function dueChars(now){let n=0;DATA.chars.forEach(x=>{if(isIntro(x.c)&&(retention(skState(x.c,'sens'),now)<.9||retention(skState(x.c,'son'),now)<.9))n++;});return n;}
function newToday(){return S.newDay&&S.newDay.d===today()?S.newDay.n:0;}
function addXP(n){const r0=rankOf(S.xp);S.xp+=n;const k=today();S.days[k]=(S.days[k]||0)+n;if(ui.sess)ui.sess.xp+=n;if(ui.game)ui.game.xp+=n;if(ui.exam)ui.exam.xp=(ui.exam.xp||0)+n;
  const r1=rankOf(S.xp);if(r1>r0){ui.levelUp=r1;buzz([60,40,160]);}}
const stats=()=>S.stats||(S.stats={});
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(_){}}

/* ---------- série de jours + jokers ---------- */
function refreshJokers(){const m=today().slice(0,7);if(S.jokerMonth!==m){S.jokerMonth=m;S.jokers=2;}}
function streakAlive(){if(!S.lastDay)return 0;return daysBetween(S.lastDay,today())<=1+S.jokers?S.streak:0;}
function markActive(){refreshJokers();const t=today();if(S.lastDay===t)return'';let msg='';
  if(!S.lastDay)S.streak=1;else{const gap=daysBetween(S.lastDay,t);if(gap===1)S.streak++;else if(gap-1<=S.jokers){S.jokers-=gap-1;S.streak++;msg='Un joker a protégé ta série.';}else S.streak=1;}
  S.lastDay=t;S.best=Math.max(S.best,S.streak);save();return msg;}

/* ============================================================
   VOIX : fichiers audio d'abord, voix du téléphone en secours
   ============================================================ */
let AUDIO={},curAudio=null,zhVoice=null;
try{AUDIO=JSON.parse(localStorage.getItem('zizi.audio'))||{};}catch(_){}
function loadVoices(){try{const vs=speechSynthesis.getVoices();zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^(zh|cmn)/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices);}catch(e){}}
async function loadAudioIndex(){try{const r=await fetch('audio/index.json',{cache:'no-cache'});if(r.ok){AUDIO=await r.json();try{localStorage.setItem('zizi.audio',JSON.stringify(AUDIO));}catch(_){}prefetchAudio();}}catch(e){}}
let prefetching=false;
async function prefetchAudio(){
  if(prefetching||!('caches' in window)||navigator.onLine===false)return;
  if(navigator.connection&&navigator.connection.saveData)return;
  prefetching=true;
  const first=[];if(DATA){const k=DATA.chars.findIndex(x=>!isIntro(x.c)),upto=k<0?DATA.chars.length:k+PAGE;
    DATA.chars.slice(0,upto).forEach(x=>{[x.a,x.ex.h,...x.w.map(w=>w.h)].forEach(t=>{if(AUDIO[t])first.push(AUDIO[t]);});});}
  try{const c=await caches.open('zizi-audio');for(const f of [...new Set([...first,...Object.values(AUDIO)])]){const url=new URL('audio/'+f,location.href).href;if(await c.match(url))continue;try{const r=await fetch(url);if(r.ok)await c.put(url,r);}catch(e){break;}}}catch(e){}
  prefetching=false;
}
function say(text,slow){
  const t=String(text).trim();try{if(curAudio){curAudio.pause();curAudio=null;}}catch(_){}
  const f=AUDIO[t];
  if(f){try{try{speechSynthesis.cancel();}catch(_){}const a=new Audio('audio/'+f);a.preservesPitch=true;a.playbackRate=slow?.7:1;curAudio=a;
    let ok=false;a.addEventListener('playing',()=>{ok=true;},{once:true});
    // réseau faible : si le son ne démarre pas en 1,5 s, la voix du téléphone prend le relais
    setTimeout(()=>{if(!ok&&curAudio===a&&!a.error){try{a.pause();}catch(_){}tts(t,slow);}},1500);
    const p=a.play();if(p&&p.catch)p.catch(()=>{if(curAudio===a){ok=true;tts(t,slow);}});return;}catch(e){}}
  tts(t,slow);
}
function tts(text,slow){
  if(!('speechSynthesis' in window))return;
  try{const go=()=>{const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=slow?.55:.85;window.__u=u;speechSynthesis.speak(u);};
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,150);}else go();}catch(e){}
}

/* ============================================================
   ORDRE DES TRAITS ET ÉCRITURE (Hanzi Writer)
   ============================================================ */
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function gridSVG(){return `<svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g stroke="var(--grid)" stroke-width=".6" stroke-dasharray="2 2" fill="none"><path d="M50 0V100M0 50H100M0 0L100 100M100 0L0 100"/></g></svg>`;}
function boxHTML(id,size){return `<div class="mizige" style="width:${size}px;height:${size}px">${gridSVG()}<div class="hw" id="${id}"></div></div>`;}
function writerSize(){return Math.min(280,Math.max(200,window.innerWidth-80));}
let writers={};
function makeWriter(id,c,opts){
  const el=document.getElementById(id);if(!el||!window.HanziWriter||!TRAITS||!TRAITS[c]){if(el)el.innerHTML=`<div class="zh-fallback">${esc(c)}</div>`;return null;}
  const size=el.parentElement.clientWidth||writerSize();
  const w=HanziWriter.create(el,c,Object.assign({width:size-4,height:size-4,padding:14,showOutline:true,
    strokeColor:css('--ink'),radicalColor:css('--bad'),outlineColor:css('--surface-2'),highlightColor:css('--accent'),drawingColor:css('--accent'),
    drawingWidth:24,strokeAnimationSpeed:1.1,delayBetweenStrokes:260,
    charDataLoader:(ch,done)=>done(TRAITS[ch])},opts||{}));
  writers[id]=w;return w;
}

/* ============================================================
   LE ROULEAU 卷 : 20 caractères par page, écrits en colonnes de droite à gauche.
   Un caractère qu'on ne révise plus pâlit ; la séance le repasse à l'encre.
   ============================================================ */
const PAGE=20,ZHN='一二三四五六七八九十';
const zhNum=n=>n<=10?ZHN[n-1]:n<20?'十'+ZHN[n-11]:String(n);
const pageCount=()=>Math.ceil(DATA.chars.length/PAGE);
const pageChars=p=>DATA.chars.slice(p*PAGE,(p+1)*PAGE);
const pageDone=(p,set)=>pageChars(p).every(x=>set?set.has(x.c):isIntro(x.c));
function curPage(){const i=DATA.chars.findIndex(x=>!isIntro(x.c));return i<0?pageCount()-1:Math.floor(i/PAGE);}
function fadingC(c,now){const r=S.chars[c];if(!r||!r.intro||now-r.intro<DAY)return false;return avg(['sens','son'].map(k=>r.sk[k]?retention(r.sk[k],now):1))<.7;}
function lectAt(){const o={};DATA.lectures.forEach(l=>{const n=[...l.need];const c=n[Math.max(0,Math.ceil(.85*n.length)-1)];if(c&&!o[c])o[c]=l.t;});return o;}
function scrollHTML(){
  const cp=curPage(),n=pageCount(),p=ui.page==null?cp:Math.max(0,Math.min(n-1,ui.page)),now=Date.now(),cs=pageChars(p),nextC=DATA.chars.find(x=>!isIntro(x.c));
  const LA=lectAt(),pop=ui.popSince||0;let k=0;
  const cells=cs.map(x=>{const on=isIntro(x.c),fade=on&&fadingC(x.c,now),nw=on&&pop&&S.chars[x.c].intro>=pop,nx=nextC&&x.c===nextC.c;
    const what=on?(fade?'à revoir':'appris'):nx?'le prochain':'à venir';
    return `<button class="sc ${on?(fade?'fade':'on'):nx?'next':'ghost'}${nw?' inkin':''}"${nw?` style="animation-delay:${(k++)*160}ms"`:''} data-act="fiche" data-c="${x.c}" aria-label="${esc(x.c+' : '+what)}">${x.c}${LA[x.c]?'<i class="sl" title="Débloque une lecture">读</i>':''}</button>`;});
  while(cells.length<PAGE)cells.push('<span class="sc" aria-hidden="true"></span>');
  const kn=cs.filter(x=>isIntro(x.c)).length,done=pageDone(p),fades=cs.filter(x=>fadingC(x.c,now)).length;
  const nextL=DATA.lectures.find(l=>lectRatio(l)<.85),toL=nextL?(()=>{const c=[...nextL.need][Math.ceil(.85*nextL.need.length)-1];return DATA.chars.findIndex(x=>x.c===c)-DATA.chars.findIndex(x=>!isIntro(x.c))+1;})():0;
  let msg;
  if(p===cp&&!done)msg=`Encore <b>${cs.length-kn}</b> caractère${cs.length-kn>1?'s':''} pour finir la page ${p+1}${nextL&&toL>0?` · la lecture « ${esc(nextL.t)} » dans ${toL}`:''}.`;

const dayNum=()=>Math.round(new Date(today()+'T12:00:00').getTime()/DAY);
function seeded(n){let x=(n%2147483646)+1;return()=>(x=x*16807%2147483647)/2147483647;}
const QUESTS={
 seance:{t:'Termine ta séance du jour',n:1,i:'今'},
 ok15:{t:'Donne 15 bonnes réponses',n:15,i:'对'},
 combo8:{t:'Enchaîne 8 bonnes réponses',n:8,i:'连',max:true},
 trace3:{t:'Trace 3 caractères sans erreur',n:3,i:'笔'},
 mem2:{t:'Écris 2 caractères de mémoire',n:2,i:'写',need:()=>knownCount()>=6},
 defi:{t:'Joue le défi du jour',n:1,i:'谜',need:()=>gamesOpen()},
 lire:{t:'Lis ou relis une lecture',n:1,i:'读',need:()=>DATA.lectures.some(l=>lectRatio(l)>=.85)},
 fiche3:{t:'Ouvre 3 fiches de ton mur',n:3,i:'字',need:()=>knownCount()>=3},
 hsk5:{t:'Réponds à 5 questions HSK',n:5,i:'考',need:()=>knownCount()>=20}
};
function questsToday(){
  const t=today();
  if(!S.q||S.q.d!==t){const r=seeded(dayNum()*7+3),pool=Object.keys(QUESTS).filter(k=>k!=='seance'&&(!QUESTS[k].need||QUESTS[k].need())),pick=[];
    while(pick.length<2&&pool.length)pick.push(pool.splice(Math.floor(r()*pool.length),1)[0]);
    S.q={d:t,ids:['seance',...pick],c:{},done:{}};save();}
  return S.q;
}
function qBump(k,v){
  const q=questsToday();if(!q.ids.includes(k)||q.done[k])return;const Q=QUESTS[k];
  q.c[k]=Q.max?Math.max(q.c[k]||0,v||0):(q.c[k]||0)+(v||1);
  if(q.c[k]>=Q.n){q.done[k]=1;addXP(20);toast('Quête réussie : '+Q.t.toLowerCase()+' · +20');
    if(q.ids.every(id=>q.done[id])){addXP(50);S.stamps[q.d]=1;S.qDays=(S.qDays||0)+1;buzz([40,60,140]);setTimeout(()=>toast('Les 3 quêtes du jour ! +50 et un sceau sur ton calendrier.'),2900);}}
  save();
}
function questsHTML(){const q=questsToday();
  return q.ids.map(k=>{const Q=QUESTS[k],c=Math.min(Q.n,q.c[k]||0),ok=!!q.done[k];
    return `<div class="quest ${ok?'ok':''}"><span class="qi">${ok?'✓':Q.i}</span><div class="grow"><div class="row between" style="gap:6px"><span class="small"><b>${esc(Q.t)}</b></span><span class="tiny muted">${ok?'+20':c+'/'+Q.n}</span></div><div class="bar"><i style="width:${pct(c/Q.n)}%"></i></div></div></div>`;}).join('');}

/* ============================================================
   EXERCICES
   ============================================================ */
const known=()=>DATA.chars.filter(x=>isIntro(x.c));
function distract(c,n,pool){
  const x=BYC[c];const base=(pool||known()).filter(y=>y.c!==c);
  const same=shuffle(base.filter(y=>y.k===x.k));const near=shuffle(base.filter(y=>Math.abs(y.n_strokes-x.n_strokes)<=2&&y.k!==x.k));
  const rest=shuffle(DATA.chars.filter(y=>y.c!==c));
  const out=[];for(const y of [...same,...near,...rest]){if(out.length>=n)break;if(!out.includes(y))out.push(y);}return out;
}
function qSens(c){const x=BYC[c];const ds=distract(c,6).filter(y=>y.m!==x.m).slice(0,3);return{kind:'sens',c,opts:shuffle([x,...ds]).map(y=>({t:y.m,ok:y.c===c}))};}
function toneVariants(p){const out=new Set();const base=p.normalize('NFD').replace(/[̀-̄̌]/g,'').normalize('NFC');
  const v=base.match(/[aeiouü]/g);if(!v)return[];const vowel=base.includes('a')?'a':base.includes('e')?'e':base.includes('ou')?'o':v[v.length-1];
  for(let t=0;t<4;t++){const mk=TONES[t]['aeiouü'.indexOf(vowel)];out.add(base.replace(vowel,mk));}out.delete(p);return[...out];}
function qSon(c){const x=BYC[c];const tv=shuffle(toneVariants(x.p)).slice(0,2);const others=distract(c,4).map(y=>y.p).filter(p=>p!==x.p&&!tv.includes(p));
  const opts=[x.p,...tv,...others].slice(0,4);return{kind:'son',c,opts:shuffle(opts).map(p=>({t:p,ok:p===x.p}))};}
function qEcoute(c){return{kind:'ecoute',c,opts:shuffle([BYC[c],...distract(c,3)]).map(y=>({c:y.c,ok:y.c===c}))};}
function qTrou(c){const x=BYC[c];return{kind:'trou',c,opts:shuffle([x,...distract(c,3)]).map(y=>({c:y.c,ok:y.c===c}))};}
/* un mot entier : le sens en français, trouver le mot en caractères */
function qMot(c){const x=BYC[c],w=rnd(x.w),len=[...w.h].length;
  const pool=shuffle(DATA.chars.flatMap(y=>y.w).filter(v=>v.h!==w.h&&v.fr!==w.fr&&[...v.h].length===len&&[...v.h].some(ch=>isIntro(ch))));
  const ds=[];for(const v of pool){if(ds.length>=3)break;if(!ds.some(d=>d.h===v.h))ds.push(v);}
  if(ds.length<3)return qSens(c);
  return{kind:'mot',c,w,opts:shuffle([w,...ds]).map(v=>({h:v.h,p:v.p,ok:v.h===w.h}))};}
function quickQ(c,k){if(k==='sens')return rnd([qSens,qSens,qTrou,qMot])(c);return Math.random()<.5?qSon(c):qEcoute(c);}
function recentAcc(){const h=S.hist.slice(-40);return h.length<8?.85:avg(h);}

/* ---------- séance du jour : pensée en minutes, le contenu s'adapte ---------- */
const DUR={5:{nw:2,rv:7,mem:1},10:{nw:4,rv:12,mem:2},15:{nw:6,rv:18,mem:3}};
/* Le retard (due) se compte en caractères à revoir (sens ou son). La séance prend plus de révisions quand il monte ;
   les nouveaux ne baissent que si le retard dépasse 3 séances. « plus » = encore des nouveaux, autant qu'on veut. */
function planSession(kind){
  const d=DUR[S.dur]||DUR[10],due=dueChars(Date.now()),acc=recentAcc(),left=DATA.chars.length-knownCount(),cap=d.rv;
  let nw=0,rv,mem=knownCount()>=4?d.mem:0;
  if(kind==='daily'){nw=d.nw;if(acc<.75)nw--;if(due>3*cap)nw=Math.ceil(nw/2);if(acc>.9&&due<cap/2)nw++;rv=Math.min(due,cap+Math.min(cap,Math.floor(due/3)));}
  else if(kind==='plus'){nw=d.nw;rv=Math.min(due,4);mem=0;}
  else rv=Math.min(due,cap+6);
  nw=Math.max(kind==='review'?0:1,Math.min(nw,left));if(!left)nw=0;
  return{nw,rv,mem,due,acc,min:Math.max(2,Math.round(nw*1.6+rv*.25+mem*.6))};
}
function startSession(kind){
  const now=Date.now(),P=planSession(kind),steps=[];
  const news=DATA.chars.filter(x=>!isIntro(x.c)).slice(0,P.nw).map(x=>x.c);
  if(kind==='plus'&&!news.length){toast('Tu as appris tous les caractères. Bravo !');return;}
  const due=dueList(now).filter(d=>!news.includes(d.c)),used=new Set();
  const take=(n,f)=>{const out=[];for(const d of due){if(out.length>=n)break;if(used.has(d.c)||(f&&!f(d)))continue;used.add(d.c);out.push(d);}return out;};
  // 1. échauffement : 3 révisions rapides
  take(news.length?Math.min(3,P.rv):Math.min(4,P.rv),d=>d.k!=='ecrit').forEach(d=>steps.push({...quickQ(d.c,d.k),sec:'Échauffement'}));
  // 2. les nouveaux : fiche, tracé, puis on vérifie tout de suite
  news.forEach(c=>{steps.push({kind:'fiche',c,sec:'Nouveau caractère'});steps.push({kind:'trace',c,sec:'Je trace'});});
  shuffle(news.flatMap(c=>[qSens(c),Math.random()<.5?qSon(c):qEcoute(c)])).forEach(q=>steps.push({...q,sec:'Je vérifie'}));
  // 3. pratique : le reste des révisions, mélangé
  const rest=take(Math.max(0,P.rv-used.size),d=>d.k!=='ecrit');
  shuffle(rest.map(d=>quickQ(d.c,d.k))).forEach(q=>steps.push({...q,sec:'Pratique'}));
  // 4. final : écrire de mémoire (les plus fragiles), puis les nouveaux dans une phrase
  const mem=take(P.mem,d=>d.k==='ecrit');
  if(mem.length<P.mem){const old=known().filter(x=>!news.includes(x.c)&&!used.has(x.c)&&!(S.chars[x.c].intro>now-DAY/2)).sort((a,b)=>peek(a.c,'ecrit')-peek(b.c,'ecrit'));
    old.slice(0,P.mem-mem.length).forEach(x=>{used.add(x.c);mem.push({c:x.c});});}
  mem.forEach(d=>steps.push({kind:'ecrire',c:d.c,sec:'Écris de mémoire'}));
  news.forEach(c=>steps.push({...qTrou(c),sec:'Dans une phrase'}));
  if(!steps.length){toast('Rien à réviser pour l’instant. Reviens plus tard !');return;}
  ui.sess={kind,steps,i:0,xp:0,ok:0,n:0,combo:0,news,end:false,t0:now,known0:knownCount(),known0Set:new Set(known().map(x=>x.c)),badges0:earnedBadges()};
  render();
}
function answer(i){
  const s=ui.sess,st=s.steps[s.i];if(st.res)return;
  const ok=!!st.opts[i].ok;st.res={ok,pick:i};s.n++;
  const k=st.kind==='sens'||st.kind==='trou'||st.kind==='mot'?'sens':'son';grade(st.c,k,ok);S.hist.push(ok?1:0);
  if(ok){s.ok++;s.combo++;addXP(10+(s.combo>=3?Math.min(10,2*(s.combo-2)):0));qBump('ok15');qBump('combo8',s.combo);stats().bestCombo=Math.max(stats().bestCombo||0,s.combo);}
  else{s.combo=0;buzz(60);}
  if(!ok&&!st.re){const q=st.kind==='sens'?qSens(st.c):st.kind==='son'?qSon(st.c):st.kind==='ecoute'?qEcoute(st.c):st.kind==='mot'?qMot(st.c):qTrou(st.c);s.steps.push({...q,sec:'On le revoit',re:true});}
  save();render();
  if(st.kind==='son'||st.kind==='sens')say(BYC[st.c].a);
  if(st.kind==='mot')say(st.w.h);
}
function next(){
  const s=ui.sess,st=s.steps[s.i];
  if(st&&st.kind==='fiche'){const r=rec(st.c);if(!r.intro){r.intro=Date.now();SK.forEach(k=>skState(st.c,k));S.newDay={d:today(),n:newToday()+1};save();}}
  writers={};try{speechSynthesis.cancel();}catch(_){}
  s.i++;if(s.i>=s.steps.length)finish();else render();window.scrollTo(0,0);
}
function finish(){
  const s=ui.sess;const msg=markActive();S.sessions++;
  if(s.kind==='daily'){S.lastSessionDay=today();qBump('seance');}
  addXP(s.kind==='daily'?40:s.kind==='plus'?30:20);S.mins=(S.mins||0)+Math.min(45,Math.max(1,Math.round((Date.now()-s.t0)/60000)));
  const kn=knownCount();s.known1=kn;s.joker=msg;
  s.unlocked=DATA.lectures.filter(l=>lectRatio(l,s.known0Set)<.85&&lectRatio(l)>=.85).map(l=>l.t);
  for(const m of [10,25,50,100,150,200,DATA.chars.length])if(kn>=m&&!S.milestones[m]){S.milestones[m]=today();s.milestone=m;}
  s.pages=[...Array(pageCount()).keys()].filter(p=>!pageDone(p,s.known0Set)&&pageDone(p));s.pages.forEach(()=>addXP(50));
  ui.popSince=s.t0;ui.page=null;
  s.newBadges=newBadges(s.badges0);save();s.end=true;render();
}

/* ============================================================
   DÉFIS : un jeu différent chaque jour, rejouable pour s'entraîner

const GAMES=[
 {id:'mystere',zh:'字谜',py:'zìmí',t:'Le caractère mystère',d:'Il apparaît trait par trait. Trouve-le avec le moins de traits possible.'},
 {id:'cles',zh:'部首',py:'bùshǒu',t:'La chasse aux clés',d:'Une clé, douze caractères : touche vite tous ceux qui ont cette clé.'},
 {id:'eclair',zh:'快',py:'kuài',t:'L’éclair',d:'60 secondes pour reconnaître un maximum de caractères. Les séries rapportent plus.'}];
const gamesOpen=()=>knownCount()>=5;
const gameOfDay=()=>GAMES[dayNum()%GAMES.length];
const gRec=id=>S.games[id]||(S.games[id]={best:0,plays:0,day:null});
function stopTimer(){if(ui.game&&ui.game.timer){clearInterval(ui.game.timer);ui.game.timer=null;}if(ui.exam&&ui.exam.timer){clearInterval(ui.exam.timer);ui.exam.timer=null;}}
function startGame(id){
  if(!gamesOpen()){toast('Apprends 5 caractères pour débloquer les défis.');return;}
  stopTimer();const daily=id===gameOfDay().id&&gRec(id).day!==today();
  ui.game={id,daily,score:0,xp:0,round:0,end:false,t0:Date.now(),badges0:earnedBadges()};
  ({mystere:mysRound,cles:huntRound,eclair:flashStart})[id]();render();window.scrollTo(0,0);
}
function gameEnd(){
  const g=ui.game;stopTimer();g.end=true;const r=gRec(g.id);g.best0=r.best;r.best=Math.max(r.best,g.score);r.plays++;
  if(g.daily){r.day=today();addXP(Math.max(10,Math.round(g.score/2)));qBump('defi');markActive();}else addXP(Math.max(5,Math.round(g.score/5)));
  S.mins=(S.mins||0)+Math.max(1,Math.round((Date.now()-g.t0)/60000));
  g.newBadges=newBadges(g.badges0);save();buzz([30,40,90]);render();
}
/* 字谜 le caractère mystère : 3 manches */
function mysPool(){const k=known().filter(x=>x.n_strokes>=4);return k.length>=4?k:known();}
function mysRound(){const g=ui.game,used=g.used||(g.used=[]);
  const pool=mysPool().filter(x=>!used.includes(x.c));const x=rnd(pool.length?pool:mysPool());used.push(x.c);
  g.c=x.c;g.k=1;g.wrong=[];g.found=false;g.opts=shuffle([x,...distract(x.c,3)]).map(y=>y.c);}
function mysMore(){const g=ui.game;if(g.found||g.k>=BYC[g.c].n_strokes)return;g.k++;render();}
function mysPick(c){const g=ui.game;if(g.found||g.wrong.includes(c))return;const n=BYC[g.c].n_strokes;
  if(c===g.c){g.found=true;const pts=Math.max(10,Math.round(100*(1-(g.k-1)/n)));g.pts=pts;g.score+=pts;g.kFound=g.k;
    stats().mysteryBest=Math.min(stats().mysteryBest||99,g.k);say(BYC[c].a);buzz(40);}
  else{g.wrong.push(c);buzz(80);if(g.k<n)g.k++;}
  render();}
function strokesSVG(c,k,size){const S_=TRAITS[c].strokes,full=k>=S_.length;
  return `<div class="mizige" style="width:${size}px;height:${size}px">${gridSVG()}<svg class="mys" viewBox="-40 -40 1104 1104" width="${size-8}" height="${size-8}" aria-label="${k} trait${k>1?'s':''} sur ${full?S_.length:'?'}"><g transform="translate(0 900) scale(1 -1)">${S_.slice(0,k).map((d,i)=>`<path d="${d}" fill="var(--ink)" class="${i===k-1?'inkin':''}"/>`).join('')}</g></svg></div>`;}
/* 部首 la chasse aux clés : 3 manches de 25 secondes */
function huntRound(){const g=ui.game;stopTimer();
  const used=g.keys||(g.keys=[]);const ks=shuffle(DATA.cles.filter(k=>k.c.length>=3&&!used.includes(k.k)));
  const K=ks.find(k=>k.c.some(isIntro))||ks[0];used.push(K.k);
  const targets=shuffle(K.c.slice()).slice(0,Math.min(4,K.c.length));
  const others=shuffle(DATA.chars.filter(x=>x.k!==K.k&&!x.comp.includes(K.k)&&x.c!==K.k)).slice(0,12-targets.length).map(x=>x.c);
  g.K=K;g.grid=shuffle([...targets,...others]);g.targets=targets;g.hit=[];g.bad=[];g.left=25;g.roundEnd=false;
  g.timer=setInterval(()=>{g.left--;const el=document.getElementById('gtime');if(el){el.textContent=g.left+' s';el.classList.toggle('low',g.left<=5);}if(g.left<=0)huntStop();},1000);}
function huntTap(c){const g=ui.game;if(g.roundEnd||g.hit.includes(c)||g.bad.includes(c))return;
  if(g.targets.includes(c)){g.hit.push(c);g.score+=10+Math.max(0,g.left>>1);buzz(25);if(g.hit.length===g.targets.length){g.score+=g.left*2;huntStop();return;}}
  else{g.bad.push(c);g.score=Math.max(0,g.score-5);buzz(80);}
  render();}
function huntStop(){const g=ui.game;if(!g||g.roundEnd)return;stopTimer();g.roundEnd=true;render();}
/* 快 l'éclair : 60 secondes de questions de sens */
function flashStart(){const g=ui.game;g.left=60;g.okN=0;g.combo=0;g.prev=null;flashQ();
  g.timer=setInterval(()=>{g.left--;const el=document.getElementById('gtime');if(el){el.textContent=g.left+' s';el.classList.toggle('low',g.left<=10);}if(g.left<=0){stats().flashBest=Math.max(stats().flashBest||0,g.okN);gameEnd();}},1000);}
function flashQ(){const g=ui.game;let x;do{x=rnd(known());}while(known().length>1&&x.c===g.prev);g.prev=x.c;g.q=qSens(x.c);g.pick=null;}
function flashPick(i){const g=ui.game;if(g.pick!=null||g.end)return;g.pick=i;const ok=g.q.opts[i].ok;
  if(ok){g.okN++;g.combo++;g.score+=10*(1+Math.floor(g.combo/3));grade(g.q.c,'sens',true);qBump('combo8',g.combo);buzz(20);}
  else{g.combo=0;grade(g.q.c,'sens',false);buzz(80);}
  S.hist.push(ok?1:0);render();setTimeout(()=>{if(ui.game===g&&!g.end){flashQ();render();}},ok?280:900);}

/* ============================================================
   EXAMEN BLANC HSK 1 · LECTURE (4 parties, comme le vrai examen)
   ============================================================ */
const PARTS=[
 {t:'Vrai ou faux',d:'Le mot veut-il bien dire ça ?'},
 {t:'Comprendre une phrase',d:'Lis la phrase et trouve son sens.'},
 {t:'Question et réponse',d:'Trouve la bonne réponse à la question.'},
 {t:'Compléter la phrase',d:'Quel mot manque ?'}];
const isH=h=>[...h].every(ch=>!HAN.test(ch)||(BYC[ch]&&BYC[ch].h));
function allWords(){const seen={},out=[];DATA.chars.forEach(x=>x.w.forEach(w=>{if(!seen[w.h]){seen[w.h]=1;out.push(w);}}));return out;}
function examQ(part){
  const W=allWords(),Wh=W.filter(w=>isH(w.h)&&[...w.h].length>=2);
  if(part===0){const w=rnd(Wh),truth=Math.random()<.5,other=rnd(Wh.filter(v=>v.fr!==w.fr&&v.h!==w.h));
    return{part,w,fr:truth?w.fr:other.fr,opts:[{t:'Vrai',ok:truth},{t:'Faux',ok:!truth}]};}
  if(part===1){const pool=[...DATA.chars.filter(x=>x.h).map(x=>x.ex),...DATA.lectures.flatMap(l=>l.s)].filter(s=>isH(s.h));
    const s=rnd(pool),ds=shuffle(pool.filter(o=>o.fr!==s.fr)).slice(0,2);
    return{part,s,opts:shuffle([s,...ds]).map(o=>({t:o.fr,ok:o===s}))};}
  if(part===2){const x=rnd(DATA.qr),ds=shuffle(DATA.qr.filter(o=>o!==x)).slice(0,2);
    return{part,s:x.q,opts:shuffle([x,...ds]).map(o=>({h:o.r.h,p:o.r.p,fr:o.r.fr,ok:o===x}))};}
  const cand=DATA.chars.filter(x=>x.h).flatMap(x=>x.w.filter(w=>[...w.h].length>=2&&x.ex.h.includes(w.h)).map(w=>({x,w})));
  const {x,w}=rnd(cand),ds=shuffle(Wh.filter(v=>v.h!==w.h&&[...v.h].length===[...w.h].length&&!x.ex.h.includes(v.h))).slice(0,3);
  return{part,s:x.ex,w,opts:shuffle([w,...ds]).map(v=>({h:v.h,p:v.p,ok:v.h===w.h}))};
}
function examOpen(){ui.exam={stage:'intro',mode:'exam',py:false};render();window.scrollTo(0,0);}
function examBegin(mode,part){
  stopTimer();const qs=[];
  if(mode==='exam')for(let p=0;p<4;p++){const seen=new Set();for(let i=0,tries=0;i<5&&tries<50;tries++){const q=examQ(p),key=JSON.stringify(q.w||q.s);if(seen.has(key))continue;seen.add(key);qs.push(q);i++;}}
  else for(let i=0;i<5;i++)qs.push(examQ(part));
  const py=ui.exam?ui.exam.py:false;
  ui.exam={stage:'q',mode,part,py,qs,i:0,ans:[],t0:Date.now(),left:17*60,xp:0,badges0:earnedBadges()};
  if(mode==='exam')ui.exam.timer=setInterval(()=>{const e=ui.exam;if(!e||e.stage!=='q')return;e.left--;const el=document.getElementById('gtime');
    if(el){el.textContent=Math.floor(e.left/60)+':'+pad(e.left%60);el.classList.toggle('low',e.left<=60);}if(e.left<=0)examFinish();},1000);
  render();window.scrollTo(0,0);
}
function examAnswer(i){const e=ui.exam;if(e.ans[e.i]!=null)return;e.ans[e.i]=i;qBump('hsk5');
  const q=e.qs[e.i],ok=!!q.opts[i].ok;S.hist.push(ok?1:0);
  if(e.mode==='exam'){save();setTimeout(()=>{if(ui.exam===e){e.i++;if(e.i>=e.qs.length)examFinish();else render();window.scrollTo(0,0);}},220);render();}
  else{if(ok)addXP(5);save();render();}
}
function examNext(){const e=ui.exam;e.i++;if(e.i>=e.qs.length)examFinish();else render();window.scrollTo(0,0);}
function examFinish(){const e=ui.exam;stopTimer();e.stage='res';
  const parts=[0,1,2,3].map(p=>{const ix=e.qs.map((q,i)=>i).filter(i=>e.qs[i].part===p);return{n:ix.length,ok:ix.filter(i=>e.ans[i]!=null&&e.qs[i].opts[e.ans[i]].ok).length};});
  const ok=parts.reduce((a,p)=>a+p.ok,0);e.score=Math.round(ok/e.qs.length*100);e.parts=parts;
  if(e.mode==='exam'){S.exams.push({d:today(),score:e.score,parts:parts.map(p=>p.ok),py:e.py});addXP(30+ok*2);markActive();}
  S.mins=(S.mins||0)+Math.max(1,Math.round((Date.now()-e.t0)/60000));
  e.newBadges=newBadges(e.badges0);save();render();window.scrollTo(0,0);}
function hskStats(){const H=DATA.chars.filter(x=>x.h),k=H.filter(x=>isIntro(x.c)).length,a=H.filter(x=>level(x.c)===3).length;
  return{n:H.length,k,a,ready:.5*k/H.length+.5*a/H.length,last:S.exams[S.exams.length-1]};}

function examQHTML(q,py,res){
  const pyl=(o)=>py&&o.p?`<span class="py">${pyHTML(o.p)}</span>`:'';
  const cls=(i,o)=>res==null?'':o.ok?'ok':res===i?'bad':'dim';
  if(q.part===0)return `<div class="card flat stack sm" style="align-items:center"><div class="exq">${esc(q.w.h)}${pyl(q.w)}</div><p class="sens" style="text-align:center">« ${esc(q.fr)} »</p></div>
    <div class="opts two">${q.opts.map((o,i)=>`<button class="opt ${cls(i,o)}" data-act="exans" data-i="${i}" ${res!=null?'disabled':''}>${o.t==='Vrai'?'✓ Vrai':'✗ Faux'}</button>`).join('')}</div>`;
  if(q.part===1)return `<div class="card flat"><div class="exq">${esc(q.s.h)}${pyl(q.s)}</div></div><div class="opts">${q.opts.map((o,i)=>`<button class="opt left ${cls(i,o)}" data-act="exans" data-i="${i}" ${res!=null?'disabled':''}>${esc(o.t)}</button>`).join('')}</div>`;
  if(q.part===2)return `<div class="card flat"><div class="exq">${esc(q.s.h)}${pyl(q.s)}</div></div><div class="opts">${q.opts.map((o,i)=>`<button class="opt left ${cls(i,o)}" data-act="exans" data-i="${i}" ${res!=null?'disabled':''}><span class="zh" style="font-size:22px">${esc(o.h)}</span>${py?`<span class="small muted">${pyHTML(o.p)}</span>`:''}</button>`).join('')}</div>`;
  const gap=esc(q.s.h).replace(esc(q.w.h),res!=null?`<span class="hl">${esc(q.w.h)}</span>`:'<span class="hl">＿＿</span>');
  return `<div class="card flat stack sm"><div class="exq">${gap}</div><p class="small muted" style="text-align:center">${esc(q.s.fr)}</p></div><div class="opts two">${q.opts.map((o,i)=>`<button class="opt ${cls(i,o)}" data-act="exans" data-i="${i}" ${res!=null?'disabled':''}><span class="zh">${esc(o.h)}</span>${py?`<span class="small muted">${pyHTML(o.p)}</span>`:''}</button>`).join('')}</div>`;
}

   ${examQHTML(q,e.py,train?res:null)}
   ${train&&res!=null?`<div class="feedback ${q.opts[res].ok?'ok':'bad'}" role="status"><span class="verdict">${q.opts[res].ok?'Exact !':'Pas tout à fait'}</span>${examSolution(q)}<button class="btn ${q.opts[res].ok?'primary':''} block" data-act="exnext">Continuer</button></div>`:''}
   ${!train?`<p class="tiny muted" style="text-align:center">Pas de correction pendant l’examen. Si tu ne sais pas, choisis au hasard : on ne perd pas de points.</p>`:''}</main>`;

function calHTML(){
  const t=new Date(today()+'T12:00:00'),dow=(t.getDay()+6)%7,start=new Date(t.getTime()-(dow+7*11)*DAY),cells=[];
  for(let i=0;i<84;i++){const d=new Date(start.getTime()+i*DAY),k=dkey(d),x=S.days[k]||0,fut=d>t;

  return `<div class="cal" aria-label="Tes 12 dernières semaines">${cells.join('')}</div>`;
}

     <div class="stack sm" style="align-items:center;text-align:center"><div class="py ${'t'+x.t}">${esc(x.p)}</div><div class="sens">${esc(x.m)}</div>${mem?`<button class="btn sm" data-act="say" data-t="${esc(x.a)}">${ICON.play} Écouter</button>`:''}</div>
     ${boxHTML('hw-main',writerSize())}
     <p class="write-status" id="wstat">${st.res?'' :mem?'Sans modèle. Après 2 erreurs, le bon trait clignote.':'Suis le modèle gris. Commence par le trait qui clignote si tu hésites.'}</p>
     ${st.res?`<div class="feedback ${st.res.ok?'ok':'bad'}"><span class="verdict">${st.res.ok?(st.res.m?'Écrit, avec '+st.res.m+' petite'+(st.res.m>1?'s':'')+' erreur'+(st.res.m>1?'s':''):'Parfait, sans erreur !'):'Pas encore ça, on le revoit'}</span><div class="row"><span class="zh" style="font-size:30px">${x.c}</span><span class="small">${esc(x.st)}</span></div><button class="btn ${st.res.ok?'primary':''} block" data-act="next">Continuer</button></div>`
     :`<div class="row" style="justify-content:center"><button class="btn sm" data-act="hint">Montrer le trait suivant</button>${mem?'':`<button class="btn sm ghost" data-act="next">Passer</button>`}</div>`}`;
  }
  else body=quizHTML(st);
  app.innerHTML=`<div class="topbar"><button class="xbtn" data-act="quit" aria-label="Quitter">${ICON.x}</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${s.i}"><i style="width:${s.i/total*100}%"></i></div>${s.combo>=3?`<span class="combo pop"><span class="zh">连</span> ×${s.combo}</span>`:`<span class="small muted" style="font-variant-numeric:tabular-nums">${s.i+1}/${total}</span>`}</div>
   <main class="lesson"><span class="sec-tag">${esc(st.sec)}</span>${body}</main>`;
  // monter l'écriture
  if(st.kind==='fiche'){const w=makeWriter('hw-main',st.c,{showCharacter:true});if(w&&!st.played)setTimeout(()=>w.animateCharacter(),350);}
  if((st.kind==='trace'||st.kind==='ecrire')&&st.res)makeWriter('hw-main',st.c,{showCharacter:true,showOutline:false,strokeColor:st.res.ok?css('--good'):css('--bad')});
  if((st.kind==='trace'||st.kind==='ecrire')&&!st.res){
    const mem=st.kind==='ecrire';
    const w=makeWriter('hw-main',st.c,{showCharacter:false,showOutline:!mem,showHintAfterMisses:mem?2:1,highlightOnComplete:true});
    if(w)w.quiz({onMistake:()=>{const e=document.getElementById('wstat');if(e)e.textContent='Pas tout à fait : regarde le sens et l’ordre du trait.';},
      onCorrectStroke:(d)=>{const e=document.getElementById('wstat');if(e)e.textContent=`Trait ${d.strokeNum+1} sur ${x.n_strokes} ✓`;},
      onComplete:(sum)=>{const m=sum.totalMistakes;const ok=mem?m<=3:true;st.res={ok,m};s.n++;if(ok)s.ok++;
        grade(st.c,'ecrit',mem?ok:m<=2);if(ok)addXP(mem?15:5);
        if(m===0){stats().perfect=(stats().perfect||0)+1;qBump('trace3');}
        if(mem&&ok){stats().mem=(stats().mem||0)+1;qBump('mem2');}
        if(mem&&!ok&&!st.re)s.steps.push({kind:'ecrire',c:st.c,sec:'On le revoit',re:true});save();setTimeout(render,700);}});
    else{st.res={ok:true,m:0};}
  }
  if(!st.played){st.played=true;if(st.kind==='fiche')say(x.a);if(st.kind==='ecoute')say(x.a);}
}
function quizHTML(st){
  const x=BYC[st.c];let head='',opts='';

  if(st.kind==='son'){head=`<p class="q-title">Comment se lit ce caractère ?</p><div class="qchar">${x.c}</div>`;opts=`<div class="opts two">${st.opts.map((o,i)=>`<button class="opt ${cls(i,o)}" data-act="ans" data-i="${i}" ${st.res?'disabled':''}><span class="py">${pyHTML(o.t)}</span></button>`).join('')}</div>`;}
  if(st.kind==='ecoute'){head=`<p class="q-title">Quel caractère entends-tu ?</p><button class="playbig" data-act="say" data-t="${esc(x.a)}" aria-label="Écouter">${ICON.play}</button>`;opts=`<div class="opts two">${st.opts.map((o,i)=>`<button class="opt ${cls(i,o)}" data-act="ans" data-i="${i}" ${st.res?'disabled':''}><span class="zh">${o.c}</span></button>`).join('')}</div>`;}
  if(st.kind==='mot'){head=`<p class="q-title">Quel mot veut dire « ${esc(st.w.fr)} » ?</p>`;opts=`<div class="opts two">${st.opts.map((o,i)=>`<button class="opt ${cls(i,o)}" data-act="ans" data-i="${i}" ${st.res?'disabled':''}><span class="zh" style="font-size:32px">${esc(o.h)}</span>${st.res?`<span class="tiny muted">${pyHTML(o.p)}</span>`:''}</button>`).join('')}</div>`;}

    head=`<p class="q-title">Quel caractère manque ?</p><div class="card flat stack sm"><div class="sent">${gap}</div><div class="small muted">${esc(x.ex.fr)}</div></div>`;

  let fb='';
  if(st.res){const s=ui.sess;fb=`<div class="feedback ${st.res.ok?'ok':'bad'}" role="status"><span class="verdict">${st.res.ok?(s.combo>=3?`${s.combo} de suite ! 太棒了！`:rnd(['Bien vu !','Exact !','对了！ Duì le !','Bravo !'])):'Pas tout à fait'}</span>
    <div class="row" style="flex-wrap:nowrap"><span class="zh" style="font-size:40px">${st.kind==='mot'?esc(st.w.h):x.c}</span><div class="grow small"><b class="${'t'+x.t}" style="font-size:18px">${st.kind==='mot'?pyHTML(st.w.p):esc(x.p)}</b> · ${esc(st.kind==='mot'?st.w.fr:x.m)}<br><span class="muted">${esc(x.st)}</span></div><button class="playmini" data-act="say" data-t="${esc(st.kind==='trou'?x.ex.h:st.kind==='mot'?st.w.h:x.a)}" aria-label="Écouter">${ICON.play}</button></div>
    ${st.kind==='trou'?`<div class="small"><b>${pyHTML(x.ex.p)}</b></div>`:''}
    ${!st.res.ok&&!st.re?'<span class="small">On le revoit dans un instant.</span>':''}<button class="btn ${st.res.ok?'primary':''} block" data-act="next">Continuer</button></div>`;}
  return head+opts+fb;
}

async function doBackup(){
  const prev=S.lastBackup;S.lastBackup=today();const txt=JSON.stringify({app:'zizi',format:1,date:new Date().toISOString(),state:S});S.lastBackup=prev;
  const name='zizi-'+(S.name||'progression').replace(/[^\p{L}\p{N}_-]+/gu,'-')+'-'+today()+'.json';
  try{const file=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sauvegarde Zìzì'});S.lastBackup=today();save();toast('Sauvegarde envoyée.');openSettings();return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);S.lastBackup=today();save();toast('Fichier enregistré : '+name);openSettings();}catch(e){toast('Sauvegarde impossible ici.');}
}

/* ---------- installation sur le téléphone ----------
   1. Chrome propose l'installation (beforeinstallprompt) : bouton « Installer ».
   2. Zìzì est ouverte dans la fenêtre de Bùbùgāo (appli installée, même adresse) : on ne peut pas l'installer
      d'ici, bouton « Ouvrir dans Chrome ». L'appli Zìzì installée démarre avec ?app=zizi (manifeste).
   3. Dans le navigateur sans proposition au bout de 4 s : on explique où est « Installer » dans le menu. */
let deferredInstall=null,installWait=false;
const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const ANDROID=/Android/i.test(navigator.userAgent),IOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
const flag=(k,v)=>{try{if(v)sessionStorage.setItem(k,'1');return sessionStorage.getItem(k)==='1';}catch(_){return !!v;}};
const ZAPP=flag('zizi.app',new URLSearchParams(location.search).get('app')==='zizi');
const IN_BUBU=STANDALONE&&!ZAPP&&flag('zizi.dansbubu',/\/bubugao-chinois\/(index\.html)?([?#].*)?$/.test(document.referrer));
function chromeLink(){const u=new URL('./',location.href);return ANDROID?`intent://${u.host}${u.pathname}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(u.href)};end`:u.href;}
function installHTML(){
  if(deferredInstall)return `<section class="card row" style="flex-wrap:nowrap"><div class="grow"><b>Installe Zìzì</b><br><span class="small muted">Une icône sur ton téléphone, et l’app marche même sans connexion.</span></div><button class="btn primary sm" data-act="install">Installer</button></section>`;
  if(S.installHelp==='non')return '';
  const deja=`<button class="btn ghost sm" data-act="installok">Elle est déjà installée</button>`;
  if(IN_BUBU)return `<section class="card stack sm" style="border:2px solid var(--accent)"><b>Installe Zìzì avec sa propre icône</b>
    <p class="small">Tu es dans la fenêtre de Bùbùgāo : d’ici, le téléphone ne peut pas installer Zìzì. Ouvre-la dans Chrome, puis touche « Installer ».</p>
    <div class="row"><a class="btn primary sm" href="${esc(chromeLink())}" target="_blank" rel="noopener">Ouvrir dans Chrome</a>${deja}</div></section>`;
  if(STANDALONE||!installWait)return '';
  return `<section class="card stack sm"><b>Installe Zìzì sur ton téléphone</b>
    <p class="small">${IOS?'Touche le bouton <b>Partager</b> (le carré avec une flèche), puis <b>« Sur l’écran d’accueil »</b>.':'Touche le menu <b>⋮</b> en haut à droite de Chrome, puis <b>« Installer l’application »</b> ou <b>« Ajouter à l’écran d’accueil »</b>.'}</p>
    <p class="tiny muted">${IOS?'Utilise Safari.':'Utilise Chrome : le navigateur de WhatsApp ou de Facebook ne sait pas installer. Si Chrome propose « Ouvrir dans Bùbùgāo », tape l’adresse toi-même dans Chrome.'}</p>
    <div class="row">${deja}</div></section>`;
}
